syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
 
option csharp_namespace = "Edi.Api";
 
package InvoiceInformation;

service InvoiceInformationService {
	rpc SayHello (HelloRequest) returns (HelloReply);
    rpc ReprocessDispatchData (ReprocessRequest) returns (ReprocessResponse);
    rpc ProcessDuplicates (ProcessDuplicatesRequest) returns (ProcessDuplicatesResponse);
	rpc GetEdiInvoiceInformation (google.protobuf.Empty) returns (ListInvoiceInformationData);
    rpc GetEdiInvoiceInformationStream (google.protobuf.Empty) returns (stream InvoiceInformationData);
    rpc GetDuplicateInvoiceInformation (google.protobuf.Empty) returns (ListDuplicateInvoiceInformation);
    rpc GetDuplicateInvoiceInformationStream (google.protobuf.Empty) returns (stream DuplicateInvoiceInformation);
    rpc GetEdiCustomerParameters (google.protobuf.Empty) returns (ListEdiCustomerParameterData);
    rpc GetEdiCustomerParametersStream (google.protobuf.Empty) returns (stream EdiCustomerParameterData);
}

message HelloRequest {
	string name = 1;
}

message HelloReply {
	string message = 1;
}

message ReprocessRequest {
    string name = 1;
}

message ReprocessResponse {
    bool success = 1;
}

message ProcessDuplicatesRequest {
    repeated DuplicateData DuplicateData = 1;
}

message DuplicateData {
    string Id = 1;
    string FileName = 2;
    string DispatchNumber = 3;
    bool IsMarkedForReprocessing = 4;
    bool IsMarkedForDeletion = 5;
}

message ProcessDuplicatesResponse {
    repeated DuplicateInvoiceInformation DuplicateInvoiceInformation = 1;
}

message ListInvoiceInformationData {
    repeated InvoiceInformationData InvoiceInformationData = 1;
}

message InvoiceInformationData {
	string Id = 1;
    string FileName = 2;
    string FinanceCode = 3;
    string DispatchNumber = 4;
    google.protobuf.Timestamp DispatchDate = 5;
    string CustomerOrderNumber = 6;
    string PartNumber = 7;
    string PartDescription = 8;
    double Quantity = 9;
    string UnloadingPoint = 10;
    string WmsSiteCode = 11;
    string WmsCustomerCode = 12;
    string CustomerDispatchNumber = 13;
    string MessageType = 14;
    double ExchangeRate = 15;
    string CustomerPartNumber = 16;
    double TotalGrossWeight = 17;
    double TotalNetWeight = 18;
    string UnitOfMeasure = 19;
    string TariffCode = 20;
    string DeliveryTerms = 21;
    string TransportDetails = 22;
    string WMSInvoiceNumber = 23;

    string CustomerLocationId = 24;
    string BatchId = 25;
    bool IsValidPrice = 26;
    bool IsValidProduct = 27;
    bool IsProcessStarted = 28;
    google.protobuf.Timestamp ProcessStartDate = 29;
    double OrderPrice = 30;
    string CurrencyCode = 31;
    double TotalInvoicePrice = 32;
    string Status = 33;
    bool IsValid = 34;
    bool IsAgressoTransferred = 35;
    google.protobuf.Timestamp ProcessCompletionDate = 36;
    string Customer = 37;
    string CustomerLocation = 38;
}

message ListDuplicateInvoiceInformation{
    repeated DuplicateInvoiceInformation DuplicateInvoiceInformation = 1;
}

message DuplicateInvoiceInformation {
    int32 Id = 1;
    string Status = 2;
    string FileName = 3;
    string FinanceCode = 4;
    google.protobuf.Timestamp UploadDate = 5;
    string DispatchNumber = 6;
    google.protobuf.Timestamp DispatchDate = 7;
    string CustomerOrderNumber = 8;
    string PartNumber = 9;
    string PartDescription = 10;
    double Quantity = 11;
    string UnloadingPoint = 12;
    string WmsSiteCode = 13;
    string WmsCustomerCode = 14;
    string CustomerDispatchNumber = 15;
    string MessageType = 16;
    double ExchangeRate = 17;
    string CustomerPartNumber = 18;
    double TotalGrossWeight = 19;
    double TotalNetWeight = 20;
    string UnitOfMeasure = 21;
    string TariffCode = 22;
    string DeliveryTerms = 23;
    string TransportDetails = 24;
    string WmsInvoiceNumber = 25;
}

message ListEdiCustomerParameterData {
    repeated EdiCustomerParameterData EdiCustomerParameterData = 1;
}

message EdiCustomerParameterData {
    string Id = 1;
    string Customer = 2;
    string CustomerLocation = 3;
    string FinanceCode = 4;
    string Unit4TaxCode = 5;
    bool IsAutomatingInvoices = 6;
    bool IsUsingCustomerDispatchNumber = 7;
    bool IsUsingPartNumber = 8;
    bool IsUsingH1CustomerOrderNumber = 9;
    string Unit4OrderIdStatus = 10;
    string Unit4ProductGroup = 11;
    string Unit4Warehouse = 12;
    string Unit4Client = 13;
    bool IsUsingH1SchedulingAgreement = 14;
    string CustomerGuid = 15;
    string CustomerLocationGuId = 16;
    bool AllowZeroPrices = 17;
    string Dim_Value_1 = 18;
    string Dim_Value_2 = 19;
    string Dim_Value_3 = 20;
    string Dim_Value_4 = 21;
    string Dim_Value_5 = 22;
    string Dim_Value_6 = 23;
    string Dim_Value_7 = 24;
    string rel_attr_id = 25;
    string rel_attr_id1 = 26;
    string rel_attr_id2 = 27;
    string rel_attr_id3 = 28;
    string rel_attr_id4 = 29;
    string rel_attr_id5 = 30;
    string rel_value  = 31;
    string rel_value1 = 32;
    string rel_value2 = 33;
    string rel_value3 = 34;
    string rel_value4 = 35;
    string rel_value5 = 36;
}
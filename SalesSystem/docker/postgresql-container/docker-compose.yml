version: '3.8'

name: postgresqldev
volumes:
  postgres_data:
    driver: local

services:
  postgresql:
    image: postgres:15-alpine
    container_name: postgresql_service
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SA_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DBDEV_USER=${DBDEV_USER}
      - DBDEV_PASSWORD=${DBDEV_PASSWORD}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: shared-dev-network


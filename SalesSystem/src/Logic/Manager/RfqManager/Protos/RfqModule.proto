syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "RfqModule";

package RfqModule;

// The greeting service definition.
service RfqModule {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Uploads a file
  rpc UploadFile (FileUploadRequest) returns (FileUploadResponse);
  rpc GetAllCustomersGrpc (GetAllCustomersGrpcRequest) returns (GetAllCustomersGrpcResponse);
  rpc GetCustomersByUserIdGrpc (GetCustomersByUserIdGrpcRequest) returns (GetCustomersByUserIdGrpcResponse);
  rpc GetProjectAssociationsByCustomerId (GetProjectAssociationsByCustomerIdRequest) returns (GetProjectAssociationsByCustomerIdResponse);
  rpc GetRfqReasonsGrpc (GetRfqReasonsGrpcRequest) returns (GetRfqReasonsGrpcResponse);
  rpc GetVehicleByProjectCodeGrpc (GetVehicleByProjectCodeGrpcRequest) returns (GetVehicleByProjectCodeGrpcResponse);
  rpc UploadPartsGrpc (UploadPartsRequestGrpcRequest) returns (UploadPartsRequestGrpcResponse);
  rpc CreateRfqProjectGrpc (CreateRfqProjectGrpcRequest) returns (CreateRfqProjectGrpcResponse);
  rpc GetAllRfqProjectGrpc (GetAllRfqProjectGrpcRequest) returns (GetAllRfqProjectGrpcResponse);
  rpc GetRfqProjectByIdGrpc (GetRfqProjectByIdGrpcRequest) returns (GetRfqProjectByIdGrpcResponse);
  rpc UpdateRfqProjectGrpc (UpdateRfqProjectGrpcRequest) returns (UpdateRfqProjectGrpcResponse);
  rpc GetRfqDrawingPartNumbersByRfqIdGrpc (GetRfqDrawingPartNumbersByRfqIdGrpcRequest) returns (GetRfqDrawingPartNumbersByRfqIdGrpcResponse);
  rpc DeleteRfqProjectByRowIdGrpc (RfqProjectRequest) returns (RfqCrudResponse);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message FileUploadRequest {
  bytes file_data = 1;
  string file_name = 2;
}

message FileUploadResponse {
  bool success = 1;
  string message = 2;
  // Additional fields for the response as needed
}

message GetAllCustomersGrpcRequest {
    int32 Position = 1;
    int32 Take = 2;
}

message GetAllCustomersGrpcResponse {
    repeated CustomerGrpc Customers = 1;
    int32 TotalCount = 2;
}

message GetCustomersByUserIdGrpcRequest {
	google.protobuf.StringValue UserId = 1;
}

// Shared request parameter message
message GetCustomersByUserIdGrpcResponse {
	repeated CustomerGrpc Customers = 1;
	int32 TotalCount = 2;
}

message CustomerGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CustomerBusinessGroupCode = 2;
    google.protobuf.StringValue CustomerBusinessGroupName = 3;   
    google.protobuf.StringValue SEWSEBusinessTeam = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message GetProjectAssociationsByCustomerIdRequest {
    string CustomerId = 1;
}

message GetProjectAssociationsByCustomerIdResponse {
    bool Success = 1;
    string Message = 2;
    repeated ProjectAssociation ProjectAssociation = 3;
}

message ProjectAssociation {
    string CustomerLocationGuid = 1;
    string CustomerProjectGuid = 2;
    string CustomerLocationName = 3;
    string CustomerProjectName = 4;
    string Id = 5;
}

message GetRfqReasonsGrpcRequest {
	int32 RequestType = 1;
	int32 Position = 2;
	int32 Take = 3;
}

message GetRfqReasonsGrpcResponse {
    repeated RfqReasonGrpc RfqReasons = 1;
}

message RfqReasonGrpc {
    google.protobuf.Int32Value RowId = 1;
    google.protobuf.StringValue RfqReasonTitle = 2;   
}

message GetVehicleByProjectCodeGrpcRequest {
    google.protobuf.StringValue ProjectCode = 1;
}

message GetVehicleByProjectCodeGrpcResponse {
    repeated VehicleGrpc Vehicles = 1;
}

message VehicleGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue VehicleName = 2;   
    google.protobuf.StringValue ProjectReference = 3;
    google.protobuf.StringValue VehicleDisplay = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message UploadPartsRequestGrpcRequest {
  bytes FileData = 1;
  string FileName = 2;
  string ProjectId = 3;
}

message RfqProject {
	int64 RowId = 1;
	string RfqNumber = 2;
	string CustomerBusinessUnitGuid = 3;
    string CustomerLocationGuid = 4;
	string ProjectGuid = 5;
	int32 RfqReasonId = 6;
	google.protobuf.Timestamp RfqResponseDeadline = 7;
	string CarModelGuid = 8;
	int32 VehicleVolume = 9;
    google.protobuf.BoolValue IsActive = 10;
    google.protobuf.Timestamp CreatedDate = 11;
    string RfqReasonName= 12;
    string CustomerBusinessGroupCode= 13;
	string CustomerLocationName= 14;
	string	ProjectName= 15;
	string	CarModelName= 16;
}


message UploadPartsRequestGrpcResponse {
    bool Success = 1;
    string Message = 2;
    RfqProject CreatedProject = 3;
}

message CustomerParts {
    google.protobuf.StringValue PartNumber1 = 1;
    google.protobuf.StringValue PartNumber2 = 2;
    google.protobuf.StringValue PartNumber3 = 3;
}

message CreateRfqProjectGrpcRequest {
  RfqProject Project = 1;
 
}

message CreateRfqProjectGrpcResponse {
    bool Success = 1;
    string Message = 2;
    string CreatedProjectId = 3;
}

message GetAllRfqProjectGrpcRequest {
	int32 RequestType = 1;
	int32 Position = 2;
	int32 Take = 3;
}

message RfqProjectWithReason {
  RfqProject Project = 1;
  string RfqReasonTitle = 2;
}

message GetAllRfqProjectGrpcResponse {
  repeated RfqProject RfqProjects = 1;
}

message GetRfqProjectByIdGrpcRequest {
  int64 RowId = 1;
}

message GetRfqProjectByIdGrpcResponse {
  RfqProject Project = 1;
}
 
enum RequestType {
  None = 0;
  Read = 1;
  ReadByRowId = 2;
}

message UpdateRfqProjectGrpcRequest {
  RfqProject Project = 1;
}

message UpdateRfqProjectGrpcResponse {
  bool Success = 1;
  string Message = 2;
}
message RfqDrawingPartNumber {
  int64 RowId = 1;
  int64 RfqId = 2;
  string OriginalPartNumber = 3;
  double OriginalPartNumberPrice = 4;
  string SwappedPartNumber = 5;
  double SwappedPartNumberPrice = 6;
  string PriceSource = 7;
  bool IsExactMatch = 8;
  bool IsSwapped = 9;
  string Comments = 10;
}

message GetRfqDrawingPartNumbersByRfqIdGrpcRequest {

  int64 RfqId = 1;
}

message GetRfqDrawingPartNumbersByRfqIdGrpcResponse {
  repeated RfqDrawingPartNumber Parts = 1;
}

message RfqProjectRequest {
  RfqProject GrpcRequestParameter = 1;
  repeated RfqProject RfqProjectGrpcsToCreate = 2;
  repeated RfqProject RfqProjectGrpcsToUpdate = 3;
  repeated RfqProject RfqProjectGrpcsToDelete = 4;
  int64 RowId = 5;
}

message RfqCrudResponse {
  bool SaveSuccess = 1;
  string Message = 2;
  google.protobuf.StringValue StringValue = 3;
}

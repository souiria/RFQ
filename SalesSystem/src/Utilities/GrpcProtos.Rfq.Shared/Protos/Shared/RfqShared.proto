syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "RfqShared";

package RfqShared;

// Shared request
message RfqDrawingPartNumbersGrpcRequest {
  RfqGrpcRequestParameter RfqGrpcRequestParameter = 1;
  repeated RfqShared.RfqDrawingPartNumberGrpc RfqDrawingPartNumbersGrpcsToCreate = 2;
  repeated RfqShared.RfqDrawingPartNumberGrpc RfqDrawingPartNumbersGrpcsToUpdate = 3;
  repeated RfqShared.RfqDrawingPartNumberGrpc RfqDrawingPartNumbersGrpcsToDelete = 4;
  int64 RfqId = 5;
}

// Shared request parameter message
message RfqGrpcRequestParameter {
	int32 RequestType = 1;
	int32 Position = 2;
	int32 Take = 3;
	google.protobuf.BoolValue BoolValue = 4;
	google.protobuf.StringValue StringValue = 5;
	google.protobuf.Int32Value IntValue = 6;
	google.protobuf.FloatValue DecimalValue = 7;
	google.protobuf.Timestamp DateTimeValue = 8;
	int64 RowId = 9;
	int64 RfqId = 10;
}

// Rfq Drawing Part Number message
message RfqDrawingPartNumberGrpc {
  int64 RowId = 1;
  int64 RfqId = 2;
  google.protobuf.StringValue OriginalPartNumber = 3;
  google.protobuf.DoubleValue OriginalPartNumberPrice = 4;
  google.protobuf.StringValue SwappedPartNumber = 5;
  google.protobuf.DoubleValue SwappedPartNumberPrice = 6;
  google.protobuf.StringValue PriceSource = 7;
  google.protobuf.BoolValue IsExactMatch = 8;
  google.protobuf.BoolValue IsSwapped = 9;
  google.protobuf.StringValue Comments = 10;
  google.protobuf.StringValue SumitomoPartNumber = 11;
  google.protobuf.StringValue SupplierPartNumber = 12;
  google.protobuf.StringValue NprId = 13;
  google.protobuf.StringValue CustomerPartNumber = 14;
  google.protobuf.StringValue NprRequest = 15;
  google.protobuf.Int32Value Status = 16;
  google.protobuf.DoubleValue Quantity = 17;
}

message ListRfqDrawingPartNumberGrpc {
	repeated RfqDrawingPartNumberGrpc RfqDrawingPartNumbers = 1;
}

// RfqReason

message RfqReasonGrpc {
    google.protobuf.Int32Value RowId = 1;
    google.protobuf.StringValue RfqReasonTitle = 2;   
}

message ListRfqReasonGrpc {
	repeated RfqReasonGrpc RfqReasons = 1;
}

// Rfq Nprs
message RfqNprRequestSampleSiteDataGrpc {
	google.protobuf.StringValue BusinessUnitCode = 1;
	google.protobuf.Int32Value SampleQty = 2;
	google.protobuf.StringValue SendSampleContactPersonName = 3;
	google.protobuf.Timestamp RequiredDate = 4;
	google.protobuf.StringValue FreightAccount = 5;
}

message RfqNprRequestGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue ReasonDescription = 2;
	google.protobuf.StringValue CustomerCode = 3;
	google.protobuf.StringValue PlatformName = 4;
	google.protobuf.StringValue ProgramName = 5;
	google.protobuf.StringValue ProjectCode = 6;
	google.protobuf.StringValue ManufacturingSite = 7;
	google.protobuf.StringValue CustomerPartNumber = 8;
	google.protobuf.StringValue SupplierPartNumber = 9;
	google.protobuf.StringValue MaterialNumber = 10;
	google.protobuf.StringValue MaterialDescription = 11;
	google.protobuf.StringValue SEWSEUnitOfMeasurement = 12;
	google.protobuf.StringValue SupplierGroup = 13;
	google.protobuf.DoubleValue QtyPerVehicle = 14;
	google.protobuf.Int32Value VehicleTotalQuantity = 15;
	google.protobuf.Timestamp DeadlineDate = 16;
	google.protobuf.StringValue NPRRaisedRemarks = 17;
	google.protobuf.BoolValue IsCustomerNominatedSupplier = 18;
	google.protobuf.BoolValue IsCustomerNominatedMaterial = 19;
	google.protobuf.BoolValue IsSampleDataRequired = 20;
	repeated RfqNprRequestSampleSiteDataGrpc SampleSiteDetails = 21;
	google.protobuf.StringValue AssociatedParts = 22;
	google.protobuf.StringValue SuggestedManufacturerGroup = 23;
	google.protobuf.Timestamp CreatedAt = 24;
	google.protobuf.StringValue CreatedBy = 25;
	google.protobuf.Timestamp ModifiedAt = 26;
	google.protobuf.StringValue ModifiedBy = 27;
	google.protobuf.Int32Value SubmissionStatus = 28;
	google.protobuf.StringValue RemoteEndpointResponse = 29;
	google.protobuf.Timestamp SubmittedAt = 30;
	google.protobuf.StringValue CustomerRfqNo = 31;
	google.protobuf.BoolValue IsActive = 32;
	google.protobuf.StringValue RequestID = 33;
	google.protobuf.StringValue OriginatorName = 34;
	google.protobuf.StringValue SupplierDetailComments = 35;
	google.protobuf.Int32Value NPRUploadSeqNo = 36;
	google.protobuf.Int32Value Status = 37;
	google.protobuf.Timestamp Closed = 38;
	google.protobuf.StringValue Reason = 39;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "EDI";

package edi;

// The edi access service definition.
service Edi {
    rpc SayHello (HelloRequest) returns (HelloReply);
	rpc GetEdiDataGrpc (EdiRequest) returns (EdiResponse);
    rpc SaveEdiDataGrpc (EdiSaveRequest) returns (EdiResponse);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  google.protobuf.StringValue message = 1;
}

message EdiRequest {
    int32 RequestType = 1;
}

message EdiSaveRequest {
    int32 RequestType = 1;
    ListEdiFileDataUploadGrpc ListEdiFileDataUploadGrpc = 2;
    ListEdiFileDataUploadDuplicatesGrpc ListEdiFileDataUploadDuplicatesGrpc = 3;
    ListEdiCustomerParameterGrpc ListEdiCustomerParameterGrpc = 4;
    ListEdiGlobalParametersGrpc ListEdiGlobalParametersGrpc = 5;
    ListEdiInvoiceInformationGrpc ListEdiInvoiceInformationGrpc = 6;
    ListEdiInvoiceInformationDuplicatesGrpc ListEdiInvoiceInformationDuplicatesGrpc = 7;
    ListEdiInvoiceUnit4Grpc ListEdiInvoiceUnit4Grpc = 8;
    ListEdiZeroPriceExceptionsGrpc ListEdiZeroPriceExceptionsGrpc = 9;
}

message EdiResponse {
    int32 ResponseType = 1;
    bool Success = 2;
    ListEdiFileDataUploadGrpc ListEdiFileDataUploadGrpc = 3;
    ListEdiFileDataUploadDuplicatesGrpc ListEdiFileDataUploadDuplicatesGrpc = 4;
    ListEdiCustomerParameterGrpc ListEdiCustomerParameterGrpc = 5;
    ListEdiGlobalParametersGrpc ListEdiGlobalParametersGrpc = 6;
    ListEdiInvoiceInformationGrpc ListEdiInvoiceInformationGrpc = 7;
    ListEdiInvoiceInformationDuplicatesGrpc ListEdiInvoiceInformationDuplicatesGrpc = 8;
    ListEdiInvoiceUnit4Grpc ListEdiInvoiceUnit4Grpc = 9;
    ListEdiZeroPriceExceptionsGrpc ListEdiZeroPriceExceptionsGrpc = 10;
}

message ListEdiCustomerParameterGrpc {
    repeated EdiCustomerParameterGrpc EdiCustomerParameterGrpc = 1;
}

message EdiCustomerParameterGrpc {
    string Id = 1;
    string Customer = 2;
    string CustomerLocation = 3;
    string FinanceCode = 4;
    string Unit4TaxCode = 5;
    bool IsAutomatingInvoices = 6;
    bool IsUsingCustomerDispatchNumber = 7;
    bool IsUsingPartNumber = 8;
    bool IsUsingH1CustomerOrderNumber = 9;
    string Unit4OrderIdStatus = 10;
    string Unit4ProductGroup = 11;
    string Unit4Warehouse = 12;
    string Unit4Client = 13;
    bool IsUsingH1SchedulingAgreement = 14;
    string CustomerGuid = 15;
    string CustomerLocationGuid = 16;
    bool AllowZeroPrices = 17;
    bool CriticalPathAlert = 18;
    string Dim_Value_1 = 19;
    string Dim_Value_2 = 20;
    string Dim_Value_3 = 21;
    string Dim_Value_4 = 22;
    string Dim_Value_5 = 23;
    string Dim_Value_6 = 24;
    string Dim_Value_7 = 25;
    string rel_attr_id = 26;
    string rel_attr_id1 = 27;
    string rel_attr_id2 = 28;
    string rel_attr_id3 = 29;
    string rel_attr_id4 = 30;
    string rel_attr_id5 = 31;
    string rel_value  = 32;
    string rel_value1 = 33;
    string rel_value2 = 34;
    string rel_value3 = 35;
    string rel_value4 = 36;
    string rel_value5 = 37;
    string DistributionList = 38;
}

message ListEdiFileDataUploadDuplicatesGrpc {
    repeated EdiFileDataUploadDuplicatesGrpc EdiFileDataUploadDuplicatesGrpc = 1;
}


syntax = "proto3";


import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "NPR";

package npr;

// The greeting service definition.
service NPR {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetAllH1NPRViewGrpc (H1NPRViewRequest) returns (ListH1NPRViewGrpc);
  rpc GetAllRFQStatusGrpc (RFQStatusRequest) returns (ListRFQStatusGrpc);
  rpc CreateNprApiGrpc (CreateNprApiGrpcRequest) returns (CreateNprApiGrpcResponse);
  rpc FilterNPRGrpc (NPRFilterRequest) returns (NPRFilterResponse);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message H1NPRViewRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message H1NPRViewGrpc{
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Subsidiary_Id = 2;
	google.protobuf.StringValue Ref_No = 3;
	google.protobuf.StringValue Type = 4;
	google.protobuf.Timestamp Raise_Date = 5;
	google.protobuf.StringValue User_Id = 6;
	google.protobuf.StringValue Status = 7;
	google.protobuf.StringValue Sumitomo_No = 8;
	google.protobuf.StringValue Description = 9;
	google.protobuf.StringValue Project_Id = 10;
	google.protobuf.StringValue Suggested_Supplier_Id = 11;
	google.protobuf.StringValue Replaced_Part = 12;
	google.protobuf.StringValue Customer_Id = 13;
	google.protobuf.StringValue Supplier_No = 14;
	google.protobuf.StringValue Assembly_No = 15;
	google.protobuf.StringValue Customer_No = 16;
	google.protobuf.StringValue UoM = 17;
	google.protobuf.DoubleValue Qty_Per_Vehicle = 18;
	google.protobuf.StringValue Eng_Comments = 19;
	google.protobuf.Timestamp Rfq_Required_Date = 20;
	google.protobuf.Timestamp Order_Date = 21;
	google.protobuf.StringValue Ordered_By = 22;
	google.protobuf.Timestamp Delv_Promise_Date = 23;
	google.protobuf.Timestamp Quotation_Date = 24;
	google.protobuf.StringValue Origin_Country = 25;
	google.protobuf.StringValue Special_Delivery = 26;
	google.protobuf.StringValue Po_No = 27;
	google.protobuf.DoubleValue Price = 28;
	google.protobuf.StringValue Currency = 29;
	google.protobuf.Int32Value Std_Lead_Time = 30;
	google.protobuf.StringValue Tariff_Code = 31;
	google.protobuf.StringValue Purchase_UoM = 32;
	google.protobuf.Int32Value Moq = 33;
	google.protobuf.Int32Value Bag_Qty = 34;
	google.protobuf.StringValue Purchasing_Comments = 35;
	google.protobuf.StringValue Actual_Supplier_Id = 36;
	google.protobuf.StringValue Material_Type = 37;
	google.protobuf.Int32Value Confac_Po = 38;
	google.protobuf.StringValue Origin_Status = 39;
	google.protobuf.Timestamp Expiry_Date = 40;
	google.protobuf.DoubleValue Copper_Weight = 41;
	google.protobuf.StringValue Support_Centre = 42;
	google.protobuf.StringValue Enquiry_Ref = 43;
	google.protobuf.StringValue Enquiry_Date = 44;
	google.protobuf.StringValue Ppap_Req_Level = 45;
	google.protobuf.StringValue Req_Qual_Doc = 46;
	google.protobuf.StringValue Air_Freight_Ref = 47;
	google.protobuf.DoubleValue Copper_Rate = 48;
	google.protobuf.DoubleValue Std_Box_Length = 49;
	google.protobuf.DoubleValue Height = 50;
	google.protobuf.DoubleValue Width = 51;
	google.protobuf.Int32Value Pack_Factor = 52;
	google.protobuf.StringValue PPAP = 53;
	google.protobuf.StringValue Status1 = 54;
	google.protobuf.StringValue Name = 55;
	google.protobuf.StringValue Facility_Nm = 56;
	google.protobuf.StringValue Full_Box_Weight = 57;
	google.protobuf.StringValue Offer_Date = 58;
	google.protobuf.StringValue Raised_By_CSLC = 59;
	google.protobuf.StringValue UOMWeight = 60;
	google.protobuf.StringValue Dev_Part = 61;
	google.protobuf.StringValue Engg_Name = 62;
	google.protobuf.Timestamp CreationDate = 63;
}

message ListH1NPRViewGrpc {
	repeated H1NPRViewGrpc H1NPRViewGrpc = 1;
}

message RFQStatusRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message RFQStatusGrpc {
	google.protobuf.StringValue RFQStatusDescription = 1;
	google.protobuf.StringValue NPRStage = 2;
}

message ListRFQStatusGrpc {
	repeated RFQStatusGrpc RFQStatusGrpc = 1;
}

message NPRFilterRequest {
    string DatabaseList = 1;
    string FilterExpression = 2;
}

message NPRFilterResponse {
	bool Success = 1;
	ListH1NPRViewGrpc ListH1NPRViewGrpc = 2;
}

 
enum NprSetRequestStatusGrpc {
  NPR_SET_STATUS_UNSPECIFIED = 0;
  LOCAL_UNCHANGED = 1;
  LOCAL_UPDATED   = 2; 
}

message RfqProjectInfoGrpc {
  int32 row_id = 1;
  google.protobuf.StringValue rfq_number = 2;
  google.protobuf.StringValue customer_business_unit_id = 3;
  google.protobuf.StringValue customer_location_id = 4;
  google.protobuf.StringValue project_id = 5;
  int32 rfq_reason_id = 6;
  google.protobuf.Timestamp rfq_response_deadline = 7;
  google.protobuf.StringValue car_model_id = 8;
  int32 vehicle_volume = 9;
  bool is_active = 10;
}

message RfqNprRequestGrpc {
  string id = 1;

  google.protobuf.StringValue reason = 2;
  google.protobuf.StringValue customer = 3;
  google.protobuf.StringValue platform_name = 4;
  google.protobuf.StringValue program_name = 5;
  google.protobuf.StringValue project = 6;

  google.protobuf.StringValue material_type = 7;
  google.protobuf.StringValue suggested_sews_e_manufacturing_site = 8;

  google.protobuf.StringValue customer_part_number = 9;
  google.protobuf.StringValue supplier_part_number = 10;
  google.protobuf.StringValue sumitomo_number = 11;

  google.protobuf.StringValue material_description = 12;
  google.protobuf.StringValue unit_of_measure = 13;
  google.protobuf.StringValue supplier_group = 14;

  google.protobuf.Int32Value qty_per_vehicle = 15;
  google.protobuf.Int32Value quantity = 16;

  google.protobuf.Timestamp required_date = 17;

  google.protobuf.StringValue raised_remarks = 18;

  bool is_customer_nominated_supplier = 19;
  bool is_customer_nominated_material = 20;
  bool samples_required = 21;

  google.protobuf.StringValue sample_site = 22;
  google.protobuf.Int32Value sample_quantity = 23;
  google.protobuf.StringValue sample_recipient = 24;
  google.protobuf.Timestamp sample_required_date = 25;

  google.protobuf.StringValue freight_account = 26;
  google.protobuf.StringValue associated_parts = 27;
  google.protobuf.StringValue suggested_manufacturer = 28;
}

message NprApiDataGrpc {
	google.protobuf.StringValue NprId = 1;
	google.protobuf.StringValue Reason = 2;
	google.protobuf.StringValue Customer = 3;
	google.protobuf.StringValue PlatformName = 4;
	google.protobuf.StringValue ProgramName = 5;
	google.protobuf.StringValue Project = 6;
	google.protobuf.StringValue MaterialType = 7;
	google.protobuf.StringValue SuggestedSewsEManufacturingSite = 8;
	google.protobuf.StringValue CustomerPartNumber = 9;
	google.protobuf.StringValue SupplierPartNumber = 10;
	google.protobuf.StringValue SumitomoNumber = 11;
	google.protobuf.StringValue MaterialDescription = 12;
	google.protobuf.StringValue UnitOfMeasure = 13;
	google.protobuf.StringValue SupplierGroup = 14;
	google.protobuf.Int32Value QtyPerVehicle = 15;
	google.protobuf.Int32Value Quantity = 16;
	google.protobuf.Timestamp RequiredDate = 17;
	google.protobuf.StringValue RaisedRemarks = 18;
	google.protobuf.BoolValue IsCustomerNominatedSupplier = 19;
	google.protobuf.BoolValue IsCustomerNominatedMaterial = 20;
	google.protobuf.BoolValue SamplesRequired = 21;
	google.protobuf.StringValue SampleSite = 22;
	google.protobuf.Int32Value SampleQuantity = 23;
	google.protobuf.StringValue SampleRecipient = 24;
	google.protobuf.Timestamp SampleRequiredDate = 25;
	google.protobuf.StringValue FreightAccount = 26;
	google.protobuf.StringValue AssociatedParts = 27;
	google.protobuf.StringValue SuggestedManufacturer = 28;
	google.protobuf.StringValue RfqNprRequestId = 29;
}

message CreateNprApiGrpcRequest {
	repeated NprApiDataGrpc NprApiData = 1;
}

message CreateNprApiGrpcResponse {
	repeated NprApiDataGrpc NprApiData = 1;
	google.protobuf.StringValue message = 2;
	google.protobuf.StringValue HttpStatusCode = 3;
}


syntax = "proto3";


import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "NPR";

package npr;

// The greeting service definition.
service NPR {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetAllH1NPRViewGrpc (H1NPRViewRequest) returns (ListH1NPRViewGrpc);
  rpc FilterNPRGrpc (NPRFilterRequest) returns (NPRFilterResponse);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message H1NPRViewRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message H1NPRViewGrpc{
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Subsidiary_Id = 2;
	google.protobuf.StringValue Ref_No = 3;
	google.protobuf.StringValue Type = 4;
	google.protobuf.Timestamp Raise_Date = 5;
	google.protobuf.StringValue User_Id = 6;
	google.protobuf.StringValue Status = 7;
	google.protobuf.StringValue Sumitomo_No = 8;
	google.protobuf.StringValue Description = 9;
	google.protobuf.StringValue Project_Id = 10;
	google.protobuf.StringValue Suggested_Supplier_Id = 11;
	google.protobuf.StringValue Replaced_Part = 12;
	google.protobuf.StringValue Customer_Id = 13;
	google.protobuf.StringValue Supplier_No = 14;
	google.protobuf.StringValue Assembly_No = 15;
	google.protobuf.StringValue Customer_No = 16;
	google.protobuf.StringValue UoM = 17;
	google.protobuf.DoubleValue Qty_Per_Vehicle = 18;
	google.protobuf.StringValue Eng_Comments = 19;
	google.protobuf.Timestamp Rfq_Required_Date = 20;
	google.protobuf.Timestamp Order_Date = 21;
	google.protobuf.StringValue Ordered_By = 22;
	google.protobuf.Timestamp Delv_Promise_Date = 23;
	google.protobuf.Timestamp Quotation_Date = 24;
	google.protobuf.StringValue Origin_Country = 25;
	google.protobuf.StringValue Special_Delivery = 26;
	google.protobuf.StringValue Po_No = 27;
	google.protobuf.DoubleValue Price = 28;
	google.protobuf.StringValue Currency = 29;
	google.protobuf.Int32Value Std_Lead_Time = 30;
	google.protobuf.StringValue Tariff_Code = 31;
	google.protobuf.StringValue Purchase_UoM = 32;
	google.protobuf.Int32Value Moq = 33;
	google.protobuf.Int32Value Bag_Qty = 34;
	google.protobuf.StringValue Purchasing_Comments = 35;
	google.protobuf.StringValue Actual_Supplier_Id = 36;
	google.protobuf.StringValue Material_Type = 37;
	google.protobuf.Int32Value Confac_Po = 38;
	google.protobuf.StringValue Origin_Status = 39;
	google.protobuf.Timestamp Expiry_Date = 40;
	google.protobuf.DoubleValue Copper_Weight = 41;
	google.protobuf.StringValue Support_Centre = 42;
	google.protobuf.StringValue Enquiry_Ref = 43;
	google.protobuf.StringValue Enquiry_Date = 44;
	google.protobuf.StringValue Ppap_Req_Level = 45;
	google.protobuf.StringValue Req_Qual_Doc = 46;
	google.protobuf.StringValue Air_Freight_Ref = 47;
	google.protobuf.DoubleValue Copper_Rate = 48;
	google.protobuf.DoubleValue Std_Box_Length = 49;
	google.protobuf.DoubleValue Height = 50;
	google.protobuf.DoubleValue Width = 51;
	google.protobuf.Int32Value Pack_Factor = 52;
	google.protobuf.StringValue PPAP = 53;
	google.protobuf.StringValue Status1 = 54;
	google.protobuf.StringValue Name = 55;
	google.protobuf.StringValue Facility_Nm = 56;
	google.protobuf.StringValue Full_Box_Weight = 57;
	google.protobuf.StringValue Offer_Date = 58;
	google.protobuf.StringValue Raised_By_CSLC = 59;
	google.protobuf.StringValue UOMWeight = 60;
	google.protobuf.StringValue Dev_Part = 61;
	google.protobuf.StringValue Engg_Name = 62;
	google.protobuf.Timestamp CreationDate = 63;
}

message ListH1NPRViewGrpc {
	repeated H1NPRViewGrpc H1NPRViewGrpc = 1;
}

message NPRFilterRequest {
    string DatabaseList = 1;
    string FilterExpression = 2;
}

message NPRFilterResponse {
	bool Success = 1;
	ListH1NPRViewGrpc ListH1NPRViewGrpc = 2;
}
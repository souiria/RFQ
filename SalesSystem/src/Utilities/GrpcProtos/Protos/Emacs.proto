syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";


option csharp_namespace = "Emacs";

package emacs;

// The Emacs service definition.
service Emacs {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  
  rpc GetCombinedPartsGrpc (CombinedPartsGrpcRequest) returns (ListCombinedPartsGrpc);
  rpc GetCombinedPartsGrpcCount (CombinedPartsCountGrpcRequest) returns (CombinedPartsCountGrpc);

  rpc GetPartCategoryDetailGrpc (PartCategoryDetailGrpcRequest) returns (ListPartCategoryDetailGrpc);

  rpc GetPartClassDetailGrpc (PartClassDetailGrpcRequest) returns (ListPartClassDetailGrpc);

  rpc GetPartGroupsGrpc (PartGroupsGrpcRequest) returns (ListPartGroupsGrpc);

  rpc GetPartGroupsConstGrpc (PartGroupsConstGrpcRequest) returns (ListPartGroupsConstGrpc);

  rpc GetCustomerDataGrpc (GetCustomerDataGrpcRequest) returns (ListCustomerDataGrpc);

  rpc GetColourCodeGrpc (GetColourCodeGrpcRequest) returns (ListColourCodeGrpc);

  rpc GetMaterialGroupsGrpc (GetMaterialGroupsGrpcRequest) returns (ListMaterialGroupsGrpc);

  rpc GetMaterialTypesGrpc (GetMaterialTypesGrpcRequest) returns (ListMaterialTypesGrpc);

  rpc GetNPACustomerGrpc (GetNPACustomerGrpcRequest) returns (ListNPACustomerGrpc);

  rpc GetNPASupplierGrpc (GetNPASupplierGrpcRequest) returns (ListNPASupplierGrpc);

  rpc GetSuppliersGrpc (GetSuppliersGrpcRequest) returns (ListSuppliersGrpc);

  rpc GetEmacsRFIViewGrpc (GetEmacsRFIViewGrpcRequest) returns (ListEmacsRFIViewGrpc);

  rpc GetPARTMSGrpc (GetPARTMSGrpcRequest) returns (ListPARTMSGrpc);

  rpc GetAlternativePartsGrpc (GetAlternativePartsGrpcRequest) returns (ListAlternativePartsGrpc);

  rpc GetAlternativePartInfoGrpc (GetAlternativePartInfoGrpcRequest) returns (AlternativePartInfoGrpc);

  rpc FilterEmacsDataGrpc (EmacsFilterRequestGrpc) returns (EmacsFilterResponseGrpc);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message CombinedPartsGrpcRequest {
  int32 position = 1;
  int32 takeAmount = 2;
}

message CombinedPartsCountGrpcRequest {
}

message CombinedPartsGrpc {
    google.protobuf.StringValue SumitomoNumber = 1;
    google.protobuf.StringValue CustomerNumber = 2;
    google.protobuf.StringValue CustomerName = 3;
    google.protobuf.StringValue SupplierNumber = 4;
    google.protobuf.StringValue UniformSumitomoNumber = 5;
    google.protobuf.StringValue UniformCustomerNumber = 6;
    google.protobuf.StringValue UniformSupplierNumber = 7;
}

message ListCombinedPartsGrpc {
    repeated CombinedPartsGrpc CombinedPartsGrpc = 1;
}

message CombinedPartsCountGrpc {
    int32 count = 1;
}


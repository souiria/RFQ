syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message PartNumberGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated PartNumberGrpc PartNumberGrpcsToCreate = 2;
  repeated PartNumberGrpc PartNumberGrpcsToUpdate = 3;
  repeated PartNumberGrpc PartNumberGrpcsToDelete = 4;
}

message PartNumberGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Name = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.StringValue ComponentId = 4;
  google.protobuf.Int32Value PartNumberType = 5;
  google.protobuf.BoolValue IsActive = 6;
}

message ListPartNumberGrpc {
  repeated PartNumberGrpc PartNumberGrpcs = 1;
}
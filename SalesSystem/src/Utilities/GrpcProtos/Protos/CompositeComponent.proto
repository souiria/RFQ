syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CommonTypes.proto";

import "FileName.proto";
import "PartNumber.proto";
import "Tag.proto";

import "Masters/FileType.proto";
import "Masters/Partner.proto";
import "Masters/Person.proto";
import "Masters/TemperatureRange.proto";

// Components
import "Components/Cable.proto";
import "Components/Clip.proto";
import "Components/Connector.proto";
import "Components/Cover.proto";	
import "Components/Diode.proto";
import "Components/Eyelet.proto";
import "Components/Fuse.proto";
import "Components/Grommet.proto";
import "Components/Housing.proto";
import "Components/MiscellaneousComponent.proto";
import "Components/Plug.proto";
import "Components/Relay.proto";
import "Components/Seal.proto";
import "Components/Shield.proto";
import "Components/Sleeve.proto";
import "Components/SubAssembly.proto";
import "Components/Support.proto";
import "Components/Terminal.proto";
import "Components/Wire.proto";
import "Components/WireProtection.proto";

import "Component.proto";

option csharp_namespace = "CDb";
package cdb;

message CompositeComponentGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated CompositeComponentGrpc CompositeComponentGrpcsToCreate = 2;
  repeated CompositeComponentGrpc CompositeComponentGrpcsToUpdate = 3;
  repeated CompositeComponentGrpc CompositeComponentGrpcsToDelete = 4;
}

message CompositeComponentGrpc {
	ComponentGrpc ComponentGrpc = 1;
	CableGrpc CableGrpc = 2;
	ClipGrpc ClipGrpc = 3;
	ConnectorGrpc ConnectorGrpc = 4;
	CoverGrpc CoverGrpc = 5;
	DiodeGrpc DiodeGrpc = 6;
	EyeletGrpc EyeletGrpc = 7;
	FuseGrpc FuseGrpc = 8;	
	GrommetGrpc GrommetGrpc = 9;
	HousingGrpc HousingGrpc = 10;
	MiscellaneousComponentGrpc MiscellaneousComponentGrpc = 11;
	PlugGrpc PlugGrpc = 12;
	RelayGrpc RelayGrpc = 13;
	SealGrpc SealGrpc = 14;
	ShieldGrpc ShieldGrpc = 15;
	SleeveGrpc SleeveGrpc = 16;
	SubAssemblyGrpc SubAssemblyGrpc = 17;
	SupportGrpc SupportGrpc = 18;
	TerminalGrpc TerminalGrpc = 19;
	WireGrpc WireGrpc = 20;
	WireProtectionGrpc WireProtectionGrpc = 21;
}

message ListCompositeComponentGrpc {
  repeated CompositeComponentGrpc CompositeComponentGrpcs = 1;
}
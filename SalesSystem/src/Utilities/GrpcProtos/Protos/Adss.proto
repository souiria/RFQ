syntax = "proto3";

option csharp_namespace = "Adss";
package adss;

service AdssGrpc {
rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetPartImage (PartImageRequest) returns (PartImageReply);
}

message PartImageRequest {
  string part_number = 1;
}

message PartImageReply {
  bytes data = 1;          
  string content_type = 2; 
}


message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
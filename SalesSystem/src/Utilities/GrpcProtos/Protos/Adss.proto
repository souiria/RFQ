syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "CommonTypes.proto";


option csharp_namespace = "Adss";
package adss;

service AdssGrpc {
 rpc SayHello (CommonTypes.HelloRequest) returns (CommonTypes.HelloReply);
  rpc GetPartImage (PartImageRequest) returns (PartImageReply);
  rpc FilterImage (FilterImageRequest) returns (FilterImageResponse);
}

message PartImageRequest {
  string part_number = 1; // Spart
}

message PartImageReply {
  bytes data = 1;          
  string content_type = 2; 
}

message FilterImageRequest {
    google.protobuf.StringValue FilterExpression = 2;
}

message FilterImageResponse {
    bool Success = 1;
    repeated PartImageDataInfo PartImageData = 2;
}

message PartImageDataInfo {
    repeated google.protobuf.StringValue SumitomoPartNumber = 1;
    repeated PartImageReply PartImage = 2;
}
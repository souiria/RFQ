syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message MiscellaneousComponentTypeGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated MiscellaneousComponentTypeGrpc MiscellaneousComponentTypeGrpcsToCreate = 2;
  repeated MiscellaneousComponentTypeGrpc MiscellaneousComponentTypeGrpcsToUpdate = 3;
}

message MiscellaneousComponentTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListMiscellaneousComponentTypeGrpc {
  repeated MiscellaneousComponentTypeGrpc MiscellaneousComponentTypeGrpcs = 1;
}
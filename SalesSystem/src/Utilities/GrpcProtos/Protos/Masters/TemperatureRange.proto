syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message TemperatureRangeGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated TemperatureRangeGrpc TemperatureRangeGrpcsToCreate = 2;
  repeated TemperatureRangeGrpc TemperatureRangeGrpcsToUpdate = 3;
}

message TemperatureRangeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue TemperatureRange = 2;
  google.protobuf.Int32Value TemperatureLow = 3;
  google.protobuf.Int32Value TemperatureHigh = 4;
  google.protobuf.BoolValue IsCustom = 5;
}

message ListTemperatureRangeGrpc {
  repeated TemperatureRangeGrpc TemperatureRangeGrpcs = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message ClipTypeGrpcRequest {
	GrpcRequestParameter GrpcRequestParameter = 1;
	repeated ClipTypeGrpc ClipTypeGrpcsToCreate = 2;
	repeated ClipTypeGrpc ClipTypeGrpcsToUpdate = 3;
}

message ClipTypeGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.StringValue Description = 3;
	google.protobuf.BoolValue IsActive = 4;
}

message ListClipTypeGrpc {
	repeated ClipTypeGrpc ClipTypeGrpcs = 1;
}
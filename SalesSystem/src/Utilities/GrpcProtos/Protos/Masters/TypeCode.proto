syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message TypeCodeGrpcRequest {
	GrpcRequestParameter GrpcRequestParameter = 1;
	repeated TypeCodeGrpc TypeCodeGrpcsToCreate = 2;
	repeated TypeCodeGrpc TypeCodeGrpcsToUpdate = 3;
}

message TypeCodeGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.BoolValue IsActive = 3;
}

message ListTypeCodeGrpc {
	repeated TypeCodeGrpc TypeCodeGrpcs = 1;
}
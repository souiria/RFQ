syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message MaterialTypeGrpcRequest {
	GrpcRequestParameter GrpcRequestParameter = 1;
	repeated MaterialTypeGrpc MaterialTypeGrpcsToCreate = 2;
	repeated MaterialTypeGrpc MaterialTypeGrpcsToUpdate = 3;
}

message MaterialTypeGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.StringValue Description = 3;
	google.protobuf.BoolValue IsActive = 4;
}

message ListMaterialTypeGrpc {
	repeated MaterialTypeGrpc MaterialTypeGrpcs = 1;
}
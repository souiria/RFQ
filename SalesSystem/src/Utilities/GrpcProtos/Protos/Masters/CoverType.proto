syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message CoverTypeGrpcRequest {
	GrpcRequestParameter GrpcRequestParameter = 1;
	repeated CoverTypeGrpc CoverTypeGrpcsToCreate = 2;
	repeated CoverTypeGrpc CoverTypeGrpcsToUpdate = 3;
}

message CoverTypeGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.StringValue Description = 3;
	google.protobuf.BoolValue IsActive = 4;
}

message ListCoverTypeGrpc {
	repeated CoverTypeGrpc CoverTypeGrpcs = 1;
}
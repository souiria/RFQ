syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message PartnerGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated PartnerGrpc PartnerGrpcsToCreate = 2;
  repeated PartnerGrpc PartnerGrpcsToUpdate = 3;
}

message PartnerGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.Int32Value PartnerType = 2;
  google.protobuf.StringValue Code = 3;
  google.protobuf.StringValue Name = 4;
  google.protobuf.StringValue Description = 5;
  google.protobuf.StringValue ContactPersonId = 6;
  google.protobuf.StringValue SupervisorPersonId = 7;
  google.protobuf.BoolValue IsActive = 8;
}

message ListPartnerGrpc {
  repeated PartnerGrpc PartnerGrpcs = 1;
}
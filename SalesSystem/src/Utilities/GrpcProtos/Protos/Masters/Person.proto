syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message PersonGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated PersonGrpc PersonGrpcsToCreate = 2;
  repeated PersonGrpc PersonGrpcsToUpdate = 3;
}

message PersonGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.Int32Value PersonType= 2;
  google.protobuf.StringValue Name = 3;
  google.protobuf.StringValue Description = 4;
  google.protobuf.StringValue Phone = 5;
  google.protobuf.StringValue Email = 6;
  google.protobuf.StringValue Address = 7;
  google.protobuf.BoolValue IsActive = 8;
}

message ListPersonGrpc {
  repeated PersonGrpc PersonGrpcs = 1;
}
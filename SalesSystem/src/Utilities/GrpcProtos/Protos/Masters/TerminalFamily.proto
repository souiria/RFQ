syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message TerminalFamilyGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated TerminalFamilyGrpc TerminalFamilyGrpcsToCreate = 2;
  repeated TerminalFamilyGrpc TerminalFamilyGrpcsToUpdate = 3;
}

message TerminalFamilyGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Name = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListTerminalFamilyGrpc {
  repeated TerminalFamilyGrpc TerminalFamilyGrpcs = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message TagGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated TagGrpc TagGrpcsToCreate = 2;
  repeated TagGrpc TagGrpcsToUpdate = 3;
  repeated TagGrpc TagGrpcsToDelete = 4;
}

message TagGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.Int32Value TagType = 2;
  google.protobuf.StringValue Name = 3;
  google.protobuf.StringValue Description = 4;
  google.protobuf.BoolValue IsActive = 5;
}

message ListTagGrpc {
  repeated TagGrpc TagGrpcs = 1;
}
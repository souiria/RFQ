syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message SleeveGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated SleeveGrpc SleeveGrpcsToCreate = 2;
  repeated SleeveGrpc SleeveGrpcsToUpdate = 3;
  repeated SleeveGrpc SleeveGrpcsToDelete = 4;
}

message SleeveGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Description = 2;
  google.protobuf.DoubleValue Diameter = 3;
  google.protobuf.DoubleValue Length = 4;
  google.protobuf.StringValue WaterproofTypeId = 5;
  google.protobuf.Int32Value Color = 6;
}

message ListSleeveGrpc {
  repeated SleeveGrpc SleeveGrpcs = 1;
}
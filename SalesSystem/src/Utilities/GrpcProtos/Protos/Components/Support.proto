syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message SupportGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated SupportGrpc SupportGrpcsToCreate = 2;
  repeated SupportGrpc SupportGrpcsToUpdate = 3;
  repeated SupportGrpc SupportGrpcsToDelete = 4;
}

message SupportGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Description = 2;
  google.protobuf.StringValue AdditionalInformation = 3;
  google.protobuf.Int32Value Color = 4;
}

message ListSupportGrpc {
  repeated SupportGrpc SupportGrpcs = 1;
}
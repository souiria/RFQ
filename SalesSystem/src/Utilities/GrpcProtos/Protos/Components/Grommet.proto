syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message GrommetGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated GrommetGrpc GrommetGrpcsToCreate = 2;
  repeated GrommetGrpc GrommetGrpcsToUpdate = 3;
  repeated GrommetGrpc GrommetGrpcsToDelete = 4;
}

message GrommetGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Location = 2;
  google.protobuf.StringValue AdditionalInformation = 3;
  google.protobuf.Int32Value Color = 4;
}

message ListGrommetGrpc {
  repeated GrommetGrpc GrommetGrpcs = 1;
}
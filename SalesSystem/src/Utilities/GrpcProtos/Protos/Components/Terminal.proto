syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message TerminalGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated TerminalGrpc TerminalGrpcsToCreate = 2;
  repeated TerminalGrpc TerminalGrpcsToUpdate = 3;
  repeated TerminalGrpc TerminalGrpcsToDelete = 4;
}

message TerminalGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue TerminalFamilyId = 2;
  google.protobuf.StringValue TerminalSizeId = 3;
  google.protobuf.StringValue WireTypeId = 4;
  google.protobuf.StringValue CrimpingIssues = 5;
  google.protobuf.StringValue WaterproofTypeId = 6;
  google.protobuf.Int32Value MatingType = 7;
  google.protobuf.StringValue AdditionalInformation = 8;
  google.protobuf.Int32Value PlatingType = 9;
}

message ListTerminalGrpc {
  repeated TerminalGrpc TerminalGrpcs = 1;
}
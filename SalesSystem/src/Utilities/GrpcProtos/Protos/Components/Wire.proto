syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "CDbCommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message WireGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated WireGrpc WireGrpcsToCreate = 2;
  repeated WireGrpc WireGrpcsToUpdate = 3;
  repeated WireGrpc WireGrpcsToDelete = 4;
}

message WireGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue WireTypeId = 2;
  google.protobuf.DoubleValue WireSection = 3;
  google.protobuf.Int32Value WireCount = 4;
  google.protobuf.StringValue Flexibility = 5;
  google.protobuf.DoubleValue InsulationThickness = 6;
  google.protobuf.DoubleValue BendingDiameter = 7;
  google.protobuf.Int32Value Color = 8;
  google.protobuf.Int32Value PlatingType = 9;
}

message ListWireGrpc {
  repeated WireGrpc WireGrpcs = 1;
}
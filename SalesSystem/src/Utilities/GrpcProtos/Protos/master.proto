message MastersFilterRequestGrpc {
    string DatabaseList = 1;
    string FilterExpression = 2;
}

message MastersFilterResponseGrpc {
    bool Success = 1;
    ListCurrencyGrpc CurrencyGrpcList = 2;
    ListCustomerGrpc CustomerGrpcList = 3;
    ListCustomerLocationGrpc CustomerLocationGrpcList = 4;
    ListCustomerSalesEntityGrpc CustomerSalesEntityGrpcList = 5;
    ListCustomerProjectAssociationGrpc CustomerProjectAssociationGrpcList = 6;
    ListCustomerBusinessUserAssociationGrpc CustomerBusinessUserAssociationGrpcList = 7;
    ListMilestoneGrpc MilestoneGrpcList = 8;
    ListPlatformGrpc PlatformGrpcList = 9;
    ListProgramGrpc ProgramGrpcList = 10;
    ListProjectGrpc ProjectGrpcList = 11;
    ListVehicleGrpc VehicleGrpcList = 12;
    ListSupplierGroupGrpc SupplierGroupGrpcList = 13;
    ListSupplierGrpc SupplierList = 14;
     ListUnitOfMeasureGrpc UnitOfMeasureGrpcList = 15;
     ListBusinessUnitGrpc BusinessUnitGrpcList = 16;
     ListProjectEngineeringAssociationGrpc ProjectEngineeringAssociationGrpcList = 17;

}
message UnitOfMeasureGrpcRequest {

syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Rfq";

package Rfq;

// The greeting service definition.
service Rfq {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc CreateRfqDrawingPartNumbersGrpc (RfqDrawingPartNumbersGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadRfqDrawingPartNumbersGrpc (RfqDrawingPartNumbersGrpcRequest) returns (ListRfqDrawingPartNumbersGrpc);
  rpc UpdateRfqDrawingPartNumbersGrpc (RfqDrawingPartNumbersGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateRfqProjectGrpc (RfqProjectGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadRfqProjectGrpc (RfqProjectGrpcRequest) returns (ListRfqProjectGrpc);
  rpc UpdateRfqProjectGrpc (RfqProjectGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateRfqNotesGrpc (RfqNotesGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadRfqNotesGrpc (RfqNotesGrpcRequest) returns (ListRfqNotesGrpc);
  rpc UpdateRfqNotesGrpc (RfqNotesGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateRfqReasonGrpc (RfqReasonGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadRfqReasonGrpc (RfqReasonGrpcRequest) returns (ListRfqReasonGrpc);
  rpc UpdateRfqReasonGrpc (RfqReasonGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateDsiBendGrpc (DsiBendGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadDsiBendGrpc (DsiBendGrpcRequest) returns (ListDsiBendGrpc);
  rpc UpdateDsiBendGrpc (DsiBendGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateDsiBranchConfigurationGrpc (DsiBranchConfigurationGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadDsiBranchConfigurationGrpc (DsiBranchConfigurationGrpcRequest) returns (ListDsiBranchConfigurationGrpc);
  rpc UpdateDsiBranchConfigurationGrpc (DsiBranchConfigurationGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateDsiBranchConfigurationBendAssociationGrpc (DsiBranchConfigurationBendAssociationGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadDsiBranchConfigurationBendAssociationGrpc (DsiBranchConfigurationBendAssociationGrpcRequest) returns (ListDsiBranchConfigurationBendAssociationGrpc);
  rpc UpdateDsiBranchConfigurationBendAssociationGrpc (DsiBranchConfigurationBendAssociationGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateDsiBranchInsulationGrpc (DsiBranchInsulationGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadDsiBranchInsulationGrpc (DsiBranchInsulationGrpcRequest) returns (ListDsiBranchInsulationGrpc);
  rpc UpdateDsiBranchInsulationGrpc (DsiBranchInsulationGrpcRequest) returns (RfqCrudGrpcResponse);

  rpc CreateDsiBranchInsulationThroughNodeGrpc (DsiBranchInsulationThroughNodeGrpcRequest) returns (RfqCrudGrpcResponse);
  rpc ReadDsiBranchInsulationThroughNodeGrpc (DsiBranchInsulationThroughNodeGrpcRequest) returns (ListDsiBranchInsulationThroughNodeGrpc);
  rpc UpdateDsiBranchInsulationThroughNodeGrpc (DsiBranchInsulationThroughNodeGrpcRequest) returns (RfqCrudGrpcResponse);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

// Shared request parameter message
message GrpcRequestParameter {
	int32 RequestType = 1;
	int32 Position = 2;
	int32 Take = 3;
	google.protobuf.BoolValue BoolValue = 4;
	google.protobuf.StringValue StringValue = 5;
	google.protobuf.Int32Value IntValue = 6;
	google.protobuf.FloatValue DecimalValue = 7;
	google.protobuf.Timestamp DateTimeValue = 8;
}

// Shared CRUD response message
message RfqCrudGrpcResponse {
    bool SaveSuccess = 1;
	string Message = 2;
	google.protobuf.StringValue StringValue = 3;
}

message RfqDrawingPartNumbersGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated RfqDrawingPartNumbersGrpc RfqDrawingPartNumbersGrpcsToCreate = 2;
  repeated RfqDrawingPartNumbersGrpc RfqDrawingPartNumbersGrpcsToUpdate = 3;
  repeated RfqDrawingPartNumbersGrpc RfqDrawingPartNumbersGrpcsToDelete = 4;
}

message RfqDrawingPartNumbersGrpc {
  int64 RowId = 1;
  int64 RfqId = 2;
  google.protobuf.StringValue OriginalPartNumber = 3;
  google.protobuf.DoubleValue OriginalPartNumberPrice = 4;
  google.protobuf.StringValue SwappedPartNumber = 5;
  google.protobuf.DoubleValue SwappedPartNumberPrice = 6;
  google.protobuf.StringValue PriceSource = 7;
  google.protobuf.BoolValue IsExactMatch = 8;
  google.protobuf.BoolValue IsSwapped = 9;
  google.protobuf.StringValue Comments = 10;
}

message ListRfqDrawingPartNumbersGrpc {
	repeated RfqDrawingPartNumbersGrpc RfqDrawingPartNumbers = 1;
}

message RfqProjectGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated RfqProjectGrpc RfqProjectGrpcsToCreate = 2;
  repeated RfqProjectGrpc RfqProjectGrpcsToUpdate = 3;
  repeated RfqProjectGrpc RfqProjectGrpcsToDelete = 4;
}

message RfqProjectGrpc {
	int64 RowId = 1;
	string RfqNumber = 2;
	google.protobuf.StringValue CustomerBusinessUnitGuid = 3;
	google.protobuf.StringValue CustomerLocationGuid = 4;
	google.protobuf.StringValue ProjectGuid = 5;
	google.protobuf.Int32Value RfqReasonId = 6;
	google.protobuf.Timestamp RfqResponseDeadline = 7;
	google.protobuf.StringValue CarModelGuid = 8;
	google.protobuf.Int32Value VehicleVolume = 9;
	google.protobuf.Timestamp CreatedDate = 10;
}

message ListRfqProjectGrpc {
	repeated RfqProjectGrpc RfqProjects = 1;
}

message RfqNotesGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated RfqNotesGrpc RfqNotesGrpcsToCreate = 2;
  repeated RfqNotesGrpc RfqNotesGrpcsToUpdate = 3;
  repeated RfqNotesGrpc RfqNotesGrpcsToDelete = 4;
}

message RfqNotesGrpc {
	int64 RowId = 1;
	int64 RfqId = 2;
	google.protobuf.StringValue Note = 3;
	google.protobuf.StringValue UserGuid = 4;
	google.protobuf.Timestamp LastModifiedOn = 5;
}

message ListRfqNotesGrpc {
	repeated RfqNotesGrpc RfqNotes = 1;
}

message RfqReasonGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated RfqReasonGrpc RfqReasonGrpcsToCreate = 2;
  repeated RfqReasonGrpc RfqReasonGrpcsToUpdate = 3;
  repeated RfqReasonGrpc RfqReasonGrpcsToDelete = 4;
}

message RfqReasonGrpc {
	int32 RowId = 1;
	string ReasonTitle = 2;

}

message ListRfqReasonGrpc {
	repeated RfqReasonGrpc RfqReasons = 1;
}

message DsiBendGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated DsiBendGrpc DsiBendGrpcsToCreate = 2;
  repeated DsiBendGrpc DsiBendGrpcsToUpdate = 3;
  repeated DsiBendGrpc DsiBendGrpcsToDelete = 4;
}

message DsiBendGrpc {
	int64 RowId = 1;
	string BendId = 2;
	google.protobuf.StringValue Bend = 3;
	google.protobuf.Timestamp CreatedDate = 4;
	google.protobuf.Timestamp ModifiedDate = 5;
	string CreatedBy = 6;
	string ModifiedBy = 7;
}

message ListDsiBendGrpc {
	repeated DsiBendGrpc DsiBends = 1;
}

message DsiBranchConfigurationGrpcRequest {
   GrpcRequestParameter GrpcRequestParameter = 1;
   repeated DsiBranchConfigurationGrpc DsiBranchConfigurationGrpcsToCreate = 2;
   repeated DsiBranchConfigurationGrpc DsiBranchConfigurationGrpcsToUpdate = 3;
   repeated DsiBranchConfigurationGrpc DsiBranchConfigurationGrpcsToDelete = 4;
}

message DsiBranchConfigurationGrpc {
	int64 RowId = 1;
	string BranchConfigurationId = 2;
	google.protobuf.StringValue StartNode = 3;
	google.protobuf.StringValue StartRoute = 4;
	google.protobuf.StringValue StartCoordinates = 5;
	google.protobuf.StringValue EndNode = 6;
	google.protobuf.StringValue EndRoute = 7;
	google.protobuf.StringValue EndCoordinates = 8;
	google.protobuf.DoubleValue Length = 9;
	google.protobuf.StringValue CircuitOptionId = 10;
	google.protobuf.DoubleValue BundleDiameter = 11;
	google.protobuf.StringValue UserModule = 12;
	google.protobuf.StringValue AssignedModule = 13;
	google.protobuf.StringValue ModuleFrom = 14;
	google.protobuf.StringValue BendString = 15;
	string HarnessId = 16;
	google.protobuf.Timestamp CreatedDate = 17;
	google.protobuf.Timestamp ModifiedDate = 18;
	string CreatedBy = 19;
	string ModifiedBy = 20;
}

message ListDsiBranchConfigurationGrpc {
	repeated DsiBranchConfigurationGrpc DsiBranchConfigurations = 1;
}

message DsiBranchConfigurationBendAssociationGrpcRequest {
   GrpcRequestParameter GrpcRequestParameter = 1;
   repeated DsiBranchConfigurationBendAssociationGrpc DsiBranchConfigurationBendAssociationGrpcsToCreate = 2;
   repeated DsiBranchConfigurationBendAssociationGrpc DsiBranchConfigurationBendAssociationGrpcsToUpdate = 3;
   repeated DsiBranchConfigurationBendAssociationGrpc DsiBranchConfigurationBendAssociationGrpcsToDelete = 4;
}

message DsiBranchConfigurationBendAssociationGrpc {
	int64 RowId = 1;
	string BendId = 2;
	string BranchConfigurationId = 3;
	google.protobuf.Timestamp CreatedDate = 5;
	google.protobuf.Timestamp ModifiedDate = 6;
	string CreatedBy = 7;
	string ModifiedBy = 8;
}

message ListDsiBranchConfigurationBendAssociationGrpc {
	repeated DsiBranchConfigurationBendAssociationGrpc DsiBranchConfigurationBendAssociations = 1;
}

message DsiBranchInsulationGrpcRequest {
   GrpcRequestParameter GrpcRequestParameter = 1;
   repeated DsiBranchInsulationGrpc DsiBranchInsulationGrpcsToCreate = 2;
   repeated DsiBranchInsulationGrpc DsiBranchInsulationGrpcsToUpdate = 3;
   repeated DsiBranchInsulationGrpc DsiBranchInsulationGrpcsToDelete = 4;
}

message DsiBranchInsulationGrpc {
	int64 RowId = 1;
	google.protobuf.StringValue StartNode = 2;
	google.protobuf.StringValue EndNode = 3;
	google.protobuf.StringValue EndRoute = 4;
	google.protobuf.StringValue PieceCode = 5;
	google.protobuf.StringValue InsulationCode = 6;
	google.protobuf.DoubleValue Diameter = 7;
	google.protobuf.StringValue CircuitOptionId = 8;
	google.protobuf.StringValue InsulationNote = 9;
	google.protobuf.StringValue UserModule = 10;
	google.protobuf.StringValue AssignedModule = 11;
	google.protobuf.StringValue ModuleFrom = 12;
	google.protobuf.StringValue CalculationMethod = 13;
	google.protobuf.DoubleValue ManualAmount = 14;
	google.protobuf.StringValue SplitValue = 15;
	google.protobuf.DoubleValue JoinNumber = 16;
	google.protobuf.DoubleValue AssemblyItemNumber = 17;
	google.protobuf.DoubleValue Layer = 18;
	google.protobuf.StringValue InsulationType = 19;
	google.protobuf.StringValue PartNumber1 = 20;
	google.protobuf.StringValue PartNumber2 = 21;
	google.protobuf.StringValue PartNumber3 = 22;
	google.protobuf.StringValue Colour = 23;
	google.protobuf.StringValue Type = 24;
	google.protobuf.StringValue Material = 25;
	google.protobuf.DoubleValue WallThickness = 26;
	google.protobuf.DoubleValue NumberOfTurns = 27;
	google.protobuf.DoubleValue TurnsPerBreakout = 28;
	google.protobuf.DoubleValue TurnsPerBranch = 29;
	google.protobuf.DoubleValue DistanceBetweenItems = 30;
	google.protobuf.DoubleValue LongestDistance = 31;
	google.protobuf.DoubleValue DistanceFromConnector = 32;
	google.protobuf.StringValue TubeSelectionType = 33;
	google.protobuf.DoubleValue TubeSelectionFactor = 34;
	google.protobuf.DoubleValue Cutback = 35;
	google.protobuf.BoolValue IsConvoluted = 36;
	google.protobuf.BoolValue IsSlit = 37;
	google.protobuf.StringValue ModuleSpecificData = 38;
	google.protobuf.StringValue HarnessId = 39;
	google.protobuf.Timestamp CreatedDate = 40;
	google.protobuf.Timestamp ModifiedDate = 41;
	string CreatedBy = 42;
	string ModifiedBy = 43;
}

message ListDsiBranchInsulationGrpc {
	repeated DsiBranchInsulationGrpc DsiBranchInsulations = 1;
}

message DsiBranchInsulationThroughNodeGrpcRequest {
   GrpcRequestParameter GrpcRequestParameter = 1;
   repeated DsiBranchInsulationThroughNodeGrpc DsiBranchInsulationThroughNodeGrpcsToCreate = 2;
   repeated DsiBranchInsulationThroughNodeGrpc DsiBranchInsulationThroughNodeGrpcsToUpdate = 3;
   repeated DsiBranchInsulationThroughNodeGrpc DsiBranchInsulationThroughNodeGrpcsToDelete = 4;
}

message DsiBranchInsulationThroughNodeGrpc {
	int64 RowId = 1;
	google.protobuf.StringValue PieceCode = 2;
	google.protobuf.DoubleValue ThroughOrder = 3;
	google.protobuf.StringValue ThroughNode = 4;
	google.protobuf.StringValue ThroughRoute = 5;
	google.protobuf.BoolValue IsThroughFlag = 6;
	google.protobuf.StringValue HarnessId = 7;
	google.protobuf.Timestamp CreatedDate = 8;
	google.protobuf.Timestamp ModifiedDate = 9;
	string CreatedBy = 10;
	string ModifiedBy = 11;
}

message ListDsiBranchInsulationThroughNodeGrpc {
	repeated DsiBranchInsulationThroughNodeGrpc DsiBranchInsulationThroughNodes = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

// FileName service definition.
service FileNameService {
  rpc GetAllFileNameGrpc (FileNameRequest) returns (ListFileNameGrpc);
  rpc GetFileNameGrpcById (FileNameRequest) returns (FileNameGrpc);
  rpc GetFileNameGrpcByIsActive (FileNameRequest) returns (ListFileNameGrpc);
  rpc DoFileNameCrud (FileNameRequest) returns (CDbCrudGrpcResponse);
}

message FileNameRequest {
  RequestParameter RequestParameter = 1;
  repeated FileNameGrpc FileNameGrpcToAdd = 2;
  repeated FileNameGrpc FileNameGrpcToUpdate = 3;
}

message FileNameGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListFileNameGrpc {
  repeated FileNameGrpc FileNameGrpc = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message FileNameGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated FileNameGrpc FileNameGrpcsToCreate = 2;
  repeated FileNameGrpc FileNameGrpcsToUpdate = 3;
  repeated FileNameGrpc FileNameGrpcsToDelete = 4;
}

message FileNameGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.Timestamp LastModified = 2;
  google.protobuf.StringValue FileTypeId = 3;
  google.protobuf.StringValue Name = 4;
  google.protobuf.StringValue Description = 5;
  google.protobuf.BoolValue IsActive = 6;
}

message ListFileNameGrpc {
  repeated FileNameGrpc FileNameGrpcs = 1;
}
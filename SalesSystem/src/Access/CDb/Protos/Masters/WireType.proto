syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

service WireTypeService {
  rpc GetAllWireTypeGrpc (WireTypeRequest) returns (ListWireTypeGrpc);
  rpc GetWireTypeGrpcById (WireTypeRequest) returns (WireTypeGrpc);
  rpc GetWireTypeGrpcByIsActive (WireTypeRequest) returns (ListWireTypeGrpc);
  rpc DoWireTypeCrud (WireTypeRequest) returns (CDbCrudGrpcResponse);
}

message WireTypeRequest {
  RequestParameter RequestParameter = 1;
  repeated WireTypeGrpc WireTypeGrpcToAdd = 2;
  repeated WireTypeGrpc WireTypeGrpcToUpdate = 3;
}

message WireTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListWireTypeGrpc {
  repeated WireTypeGrpc WireTypeGrpc = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

// Material service definition.
service MaterialService {
  rpc GetAllMaterialGrpc (MaterialRequest) returns (ListMaterialGrpc);
  rpc GetMaterialGrpcById (MaterialRequest) returns (MaterialGrpc);
  rpc GetMaterialGrpcByIsActive (MaterialRequest) returns (ListMaterialGrpc);
  rpc DoMaterialCrud (MaterialRequest) returns (CDbCrudGrpcResponse);
}

message MaterialRequest {
	RequestParameter RequestParameter = 1;
	repeated MaterialGrpc MaterialGrpcToAdd = 2;
	repeated MaterialGrpc MaterialGrpcToUpdate = 3;
}

message MaterialGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.StringValue Description = 3;
	google.protobuf.BoolValue IsActive = 4;
}

message ListMaterialGrpc {
	repeated MaterialGrpc MaterialGrpc = 1;
}
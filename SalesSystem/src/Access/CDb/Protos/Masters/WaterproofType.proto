syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

service WaterproofTypeService {
  rpc GetAllWaterproofTypeGrpc (WaterproofTypeRequest) returns (ListWaterproofTypeGrpc);
  rpc GetWaterproofTypeGrpcById (WaterproofTypeRequest) returns (WaterproofTypeGrpc);
  rpc GetWaterproofTypeGrpcByIsActive (WaterproofTypeRequest) returns (ListWaterproofTypeGrpc);
  rpc DoWaterproofTypeCrud (WaterproofTypeRequest) returns (CDbCrudGrpcResponse);
}

message WaterproofTypeRequest {
  RequestParameter RequestParameter = 1;
  repeated WaterproofTypeGrpc WaterproofTypeGrpcToAdd = 2;
  repeated WaterproofTypeGrpc WaterproofTypeGrpcToUpdate = 3;
}

message WaterproofTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListWaterproofTypeGrpc {
  repeated WaterproofTypeGrpc WaterproofTypeGrpc = 1;
}
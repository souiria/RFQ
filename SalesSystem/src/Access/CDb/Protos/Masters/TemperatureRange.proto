syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

service TemperatureRangeService {
  rpc GetAllTemperatureRangeGrpc (TemperatureRangeRequest) returns (ListTemperatureRangeGrpc);
  rpc GetTemperatureRangeGrpcById (TemperatureRangeRequest) returns (TemperatureRangeGrpc);
  rpc GetTemperatureRangeGrpcByIsActive (TemperatureRangeRequest) returns (ListTemperatureRangeGrpc);
  rpc DoTemperatureRangeCrud (TemperatureRangeRequest) returns (CDbCrudGrpcResponse);
}

message TemperatureRangeRequest {
  RequestParameter RequestParameter = 1;
  repeated TemperatureRangeGrpc TemperatureRangeGrpcToAdd = 2;
  repeated TemperatureRangeGrpc TemperatureRangeGrpcToUpdate = 3;
}

message TemperatureRangeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListTemperatureRangeGrpc {
  repeated TemperatureRangeGrpc TemperatureRangeGrpc = 1;
}
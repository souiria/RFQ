syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

service TerminalSizeService {
  rpc GetAllTerminalSizeGrpc (TerminalSizeRequest) returns (ListTerminalSizeGrpc);
  rpc GetTerminalSizeGrpcById (TerminalSizeRequest) returns (TerminalSizeGrpc);
  rpc GetTerminalSizeGrpcByIsActive (TerminalSizeRequest) returns (ListTerminalSizeGrpc);
  rpc DoTerminalSizeCrud (TerminalSizeRequest) returns (CDbCrudGrpcResponse);
}

message TerminalSizeRequest {
  RequestParameter RequestParameter = 1;
  repeated TerminalSizeGrpc TerminalSizeGrpcToAdd = 2;
  repeated TerminalSizeGrpc TerminalSizeGrpcToUpdate = 3;
}

message TerminalSizeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListTerminalSizeGrpc {
  repeated TerminalSizeGrpc TerminalSizeGrpc = 1;
}
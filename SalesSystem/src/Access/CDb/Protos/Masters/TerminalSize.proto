syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message TerminalSizeRequest {
  RequestParameter RequestParameter = 1;
  repeated TerminalSizeGrpc TerminalSizeGrpcsToCreate = 2;
  repeated TerminalSizeGrpc TerminalSizeGrpcsToUpdate = 3;
}

message TerminalSizeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Name = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListTerminalSizeGrpc {
  repeated TerminalSizeGrpc TerminalSizeGrpcs = 1;
}
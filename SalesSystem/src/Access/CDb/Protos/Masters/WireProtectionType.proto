syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message WireProtectionTypeRequest {
  RequestParameter RequestParameter = 1;
  repeated WireProtectionTypeGrpc WireProtectionTypeGrpcsToCreate = 2;
  repeated WireProtectionTypeGrpc WireProtectionTypeGrpcsToUpdate = 3;
}

message WireProtectionTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListWireProtectionTypeGrpc {
  repeated WireProtectionTypeGrpc WireProtectionTypeGrpcs = 1;
}
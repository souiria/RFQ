syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

service WireProtectionTypeService {
  rpc GetAllWireProtectionTypeGrpc (WireProtectionTypeRequest) returns (ListWireProtectionTypeGrpc);
  rpc GetWireProtectionTypeGrpcById (WireProtectionTypeRequest) returns (WireProtectionTypeGrpc);
  rpc GetWireProtectionTypeGrpcByIsActive (WireProtectionTypeRequest) returns (ListWireProtectionTypeGrpc);
  rpc DoWireProtectionTypeCrud (WireProtectionTypeRequest) returns (CDbCrudGrpcResponse);
}

message WireProtectionTypeRequest {
  RequestParameter RequestParameter = 1;
  repeated WireProtectionTypeGrpc WireProtectionTypeGrpcToAdd = 2;
  repeated WireProtectionTypeGrpc WireProtectionTypeGrpcToUpdate = 3;
}

message WireProtectionTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListWireProtectionTypeGrpc {
  repeated WireProtectionTypeGrpc WireProtectionTypeGrpc = 1;
}
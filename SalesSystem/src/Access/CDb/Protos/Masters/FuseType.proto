syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

service FuseTypeService {
  rpc GetAllFuseTypeGrpc (FuseTypeRequest) returns (ListFuseTypeGrpc);
  rpc GetFuseTypeGrpcById (FuseTypeRequest) returns (FuseTypeGrpc);
  rpc GetFuseTypeGrpcByIsActive (FuseTypeRequest) returns (ListFuseTypeGrpc);
  rpc DoFuseTypeCrud (FuseTypeRequest) returns (CDbCrudGrpcResponse);
}

message FuseTypeRequest {
  RequestParameter RequestParameter = 1;
  repeated FuseTypeGrpc FuseTypeGrpcToAdd = 2;
  repeated FuseTypeGrpc FuseTypeGrpcToUpdate = 3;
}

message FuseTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListFuseTypeGrpc {
  repeated FuseTypeGrpc FuseTypeGrpc = 1;
}
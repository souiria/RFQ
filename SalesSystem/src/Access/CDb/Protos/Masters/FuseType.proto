syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message FuseTypeGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated FuseTypeGrpc FuseTypeGrpcsToCreate = 2;
  repeated FuseTypeGrpc FuseTypeGrpcsToUpdate = 3;
}

message FuseTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListFuseTypeGrpc {
  repeated FuseTypeGrpc FuseTypeGrpcs = 1;
}
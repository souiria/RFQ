syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

// CoverType service definition.
service CoverTypeService {
  rpc GetAllCoverTypeGrpc (CoverTypeRequest) returns (ListCoverTypeGrpc);
  rpc GetCoverTypeGrpcById (CoverTypeRequest) returns (CoverTypeGrpc);
  rpc GetCoverTypeGrpcByIsActive (CoverTypeRequest) returns (ListCoverTypeGrpc);
  rpc DoCoverTypeCrud (CoverTypeRequest) returns (CDbCrudGrpcResponse);
}

message CoverTypeRequest {
	RequestParameter RequestParameter = 1;
	repeated CoverTypeGrpc CoverTypeGrpcToAdd = 2;
	repeated CoverTypeGrpc CoverTypeGrpcToUpdate = 3;
}

message CoverTypeGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.StringValue Description = 3;
	google.protobuf.BoolValue IsActive = 4;
}

message ListCoverTypeGrpc {
	repeated CoverTypeGrpc CoverTypeGrpc = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message FileTypeRequest {
  RequestParameter RequestParameter = 1;
  repeated FileTypeGrpc FileTypeGrpcsToCreate = 2;
  repeated FileTypeGrpc FileTypeGrpcsToUpdate = 3;
}

message FileTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Name = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListFileTypeGrpc {
  repeated FileTypeGrpc FileTypeGrpcs = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

service MiscComponentTypeService {
  rpc GetAllMiscComponentTypeGrpc (MiscComponentTypeRequest) returns (ListMiscComponentTypeGrpc);
  rpc GetMiscComponentTypeGrpcById (MiscComponentTypeRequest) returns (MiscComponentTypeGrpc);
  rpc GetMiscComponentTypeGrpcByIsActive (MiscComponentTypeRequest) returns (ListMiscComponentTypeGrpc);
  rpc DoMiscComponentTypeCrud (MiscComponentTypeRequest) returns (CDbCrudGrpcResponse);
}

message MiscComponentTypeRequest {
  RequestParameter RequestParameter = 1;
  repeated MiscComponentTypeGrpc MiscComponentTypeGrpcToAdd = 2;
  repeated MiscComponentTypeGrpc MiscComponentTypeGrpcToUpdate = 3;
}

message MiscComponentTypeGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListMiscComponentTypeGrpc {
  repeated MiscComponentTypeGrpc MiscComponentTypeGrpc = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;
message CrimpingProcessTypeGrpcRequest {
	GrpcRequestParameter GrpcRequestParameter = 1;
	repeated CrimpingProcessTypeGrpc CrimpingProcessTypeGrpcsToCreate = 2;
	repeated CrimpingProcessTypeGrpc CrimpingProcessTypeGrpcsToUpdate = 3;
}

message CrimpingProcessTypeGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.StringValue Description = 3;
	google.protobuf.BoolValue IsActive = 4;
}

message ListCrimpingProcessTypeGrpc {
	repeated CrimpingProcessTypeGrpc CrimpingProcessTypeGrpcs = 1;
}
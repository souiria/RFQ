syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

// CrimpingProcessType service definition.
service CrimpingProcessTypeService {
  rpc GetAllCrimpingProcessTypeGrpc (CrimpingProcessTypeRequest) returns (ListCrimpingProcessTypeGrpc);
  rpc GetCrimpingProcessTypeGrpcById (CrimpingProcessTypeRequest) returns (CrimpingProcessTypeGrpc);
  rpc GetCrimpingProcessTypeGrpcByIsActive (CrimpingProcessTypeRequest) returns (ListCrimpingProcessTypeGrpc);
  rpc DoCrimpingProcessTypeCrud (CrimpingProcessTypeRequest) returns (CDbCrudGrpcResponse);
}

message CrimpingProcessTypeRequest {
	RequestParameter RequestParameter = 1;
	repeated CrimpingProcessTypeGrpc CrimpingProcessTypeGrpcToAdd = 2;
	repeated CrimpingProcessTypeGrpc CrimpingProcessTypeGrpcToUpdate = 3;
}

message CrimpingProcessTypeGrpc {
	google.protobuf.StringValue Id = 1;
	google.protobuf.StringValue Code = 2;
	google.protobuf.StringValue Description = 3;
	google.protobuf.BoolValue IsActive = 4;
}

message ListCrimpingProcessTypeGrpc {
	repeated CrimpingProcessTypeGrpc CrimpingProcessTypeGrpc = 1;
}
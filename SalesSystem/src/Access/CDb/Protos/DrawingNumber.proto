syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

// DrawingNumber service definition.
service DrawingNumberService {
  rpc GetAllDrawingNumberGrpc (DrawingNumberRequest) returns (ListDrawingNumberGrpc);
  rpc GetDrawingNumberGrpcById (DrawingNumberRequest) returns (DrawingNumberGrpc);
  rpc GetDrawingNumberGrpcByIsActive (DrawingNumberRequest) returns (ListDrawingNumberGrpc);
  rpc DoDrawingNumberCrud (DrawingNumberRequest) returns (CDbCrudGrpcResponse);
}

message DrawingNumberRequest {
  RequestParameter RequestParameter = 1;
  repeated DrawingNumberGrpc DrawingNumberGrpcToAdd = 2;
  repeated DrawingNumberGrpc DrawingNumberGrpcToUpdate = 3;
}

message DrawingNumberGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListDrawingNumberGrpc {
  repeated DrawingNumberGrpc DrawingNumberGrpc = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message SealGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated SealGrpc SealGrpcsToCreate = 2;
  repeated SealGrpc SealGrpcsToUpdate = 3;
  repeated SealGrpc SealGrpcsToDelete = 4;
}

message SealGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Description = 2;
  google.protobuf.DoubleValue Diameter = 3;
  google.protobuf.Int32Value Color = 4;
}

message ListSealGrpc {
  repeated SealGrpc SealGrpcs = 1;
}
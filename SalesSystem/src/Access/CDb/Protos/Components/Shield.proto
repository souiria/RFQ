syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message ShieldGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated ShieldGrpc ShieldGrpcsToCreate = 2;
  repeated ShieldGrpc ShieldGrpcsToUpdate = 3;
  repeated ShieldGrpc ShieldGrpcsToDelete = 4;
}

message ShieldGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Description = 2;
  google.protobuf.StringValue AdditionalInformation = 3;
  google.protobuf.Int32Value Color = 4;
}

message ListShieldGrpc {
  repeated ShieldGrpc ShieldGrpcs = 1;
}
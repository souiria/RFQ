syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message HousingGrpcRequest {
  RequestParameter RequestParameter = 1;
  repeated HousingGrpc HousingGrpcsToCreate = 2;
  repeated HousingGrpc HousingGrpcsToUpdate = 3;
  repeated HousingGrpc HousingGrpcsToDelete = 4;
}

message HousingGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Description = 2;
  google.protobuf.Int32Value Color = 3;
}

message ListHousingGrpc {
  repeated HousingGrpc HousingGrpcs = 1;
}
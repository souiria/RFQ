syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message EyeletGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated EyeletGrpc EyeletGrpcsToCreate = 2;
  repeated EyeletGrpc EyeletGrpcsToUpdate = 3;
  repeated EyeletGrpc EyeletGrpcsToDelete = 4;
}

message EyeletGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.DoubleValue StudSize = 2;
  google.protobuf.DoubleValue Thickness = 3;
  google.protobuf.Int32Value Angle = 4;
  google.protobuf.BoolValue IsWaterproof = 5;
  google.protobuf.BoolValue IsCr6Free = 6;
  google.protobuf.StringValue Family = 7;
  google.protobuf.StringValue AdditionalInformation = 8;
  google.protobuf.Int32Value PlatingType = 9;
}

message ListEyeletGrpc {
  repeated EyeletGrpc EyeletGrpcs = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message MiscellaneousComponentGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated MiscellaneousComponentGrpc MiscellaneousComponentGrpcsToCreate = 2;
  repeated MiscellaneousComponentGrpc MiscellaneousComponentGrpcsToUpdate = 3;
  repeated MiscellaneousComponentGrpc MiscellaneousComponentGrpcsToDelete = 4;
}

message MiscellaneousComponentGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue MiscellaneousComponentTypeId = 2;
  google.protobuf.StringValue Dimension = 3;
  google.protobuf.StringValue AdditionalInformation = 4;
  google.protobuf.Int32Value Color = 5;
}

message ListMiscellaneousComponentGrpc {
  repeated MiscellaneousComponentGrpc MiscellaneousComponentGrpcs = 1;
}
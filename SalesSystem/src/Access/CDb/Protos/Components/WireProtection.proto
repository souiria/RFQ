syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message WireProtectionGrpcRequest {
  GrpcRequestParameter GrpcRequestParameter = 1;
  repeated WireProtectionGrpc WireProtectionGrpcsToCreate = 2;
  repeated WireProtectionGrpc WireProtectionGrpcsToUpdate = 3;
  repeated WireProtectionGrpc WireProtectionGrpcsToDelete = 4;
}

message WireProtectionGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue WireProtectionTypeId = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.DoubleValue TapeWidth = 4;
  google.protobuf.DoubleValue TubeDiameter = 5;
  google.protobuf.StringValue Specification = 6;
  google.protobuf.StringValue AdditionalInformation = 7;
  google.protobuf.Int32Value Color = 8;
}

message ListWireProtectionGrpc {
  repeated WireProtectionGrpc WireProtectionGrpcs = 1;
}
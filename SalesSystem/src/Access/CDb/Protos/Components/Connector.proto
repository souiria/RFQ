syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message ConnectorGrpcRequest {
  RequestParameter RequestParameter = 1;
  repeated ConnectorGrpc ConnectorGrpcsToCreate = 2;
  repeated ConnectorGrpc ConnectorGrpcsToUpdate = 3;
  repeated ConnectorGrpc ConnectorGrpcsToDelete = 4;
}

message ConnectorGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue WaterproofTypeId = 2;
  google.protobuf.Int32Value MatingType = 3;
  google.protobuf.DoubleValue CavitySize = 4;
  google.protobuf.Int32Value CavityCount = 5;
  google.protobuf.BoolValue IsHybrid = 6;
  google.protobuf.BoolValue IsModule = 7;
  google.protobuf.StringValue TerminalFamilyId = 8;
  google.protobuf.StringValue TerminalSizeId = 9;
  google.protobuf.StringValue AdditionalInformation = 10;
  google.protobuf.Int32Value Color = 11;
}

message ListConnectorGrpc {
  repeated ConnectorGrpc ConnectorGrpcs = 1;
}
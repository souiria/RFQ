syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

// Shared request type enum
enum TagType {
	SYSTEM = 0;
	PROJECT = 1;
	VEHICLE = 2;
}

message TagGrpcRequest {
  RequestParameter RequestParameter = 1;
  repeated TagGrpc TagsToAdd = 2;
  repeated TagGrpc TagsToUpdate = 3;
  repeated TagGrpc TagsToDelete = 4;
}

message TagGrpc {
  google.protobuf.StringValue Id = 1;
  TagType TagType = 2;
  google.protobuf.StringValue Name = 3;
  google.protobuf.StringValue Description = 4;
  google.protobuf.BoolValue IsDeleted = 5;
}

message ListTagGrpc {
  repeated TagGrpc Tags = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

message PartNumberGrpcRequest {
  RequestParameter RequestParameter = 1;
  repeated PartNumberGrpc PartNumbersToAdd = 2;
  repeated PartNumberGrpc PartNumbersToUpdate = 3;
  repeated PartNumberGrpc PartNumbersToDelete = 4;
}

message PartNumberGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListPartNumberGrpc {
  repeated PartNumberGrpc PartNumbers = 1;
}
syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/CommonTypes.proto";

option csharp_namespace = "CDb";
package cdb;

// AuditEvent service definition.
service AuditEventService {
  rpc GetAllAuditEventGrpc (AuditEventRequest) returns (ListAuditEventGrpc);
  rpc GetAuditEventGrpcById (AuditEventRequest) returns (AuditEventGrpc);
  rpc GetAuditEventGrpcByIsActive (AuditEventRequest) returns (ListAuditEventGrpc);
  rpc DoAuditEventCrud (AuditEventRequest) returns (CDbCrudGrpcResponse);
}

message AuditEventRequest {
  RequestParameter RequestParameter = 1;
  repeated AuditEventGrpc AuditEventGrpcToAdd = 2;
  repeated AuditEventGrpc AuditEventGrpcToUpdate = 3;
}

message AuditEventGrpc {
  google.protobuf.StringValue Id = 1;
  google.protobuf.StringValue Code = 2;
  google.protobuf.StringValue Description = 3;
  google.protobuf.BoolValue IsActive = 4;
}

message ListAuditEventGrpc {
  repeated AuditEventGrpc AuditEventGrpc = 1;
}
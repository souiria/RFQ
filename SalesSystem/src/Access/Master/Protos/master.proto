syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Master";

package master;

// The master access service definition.
service Master {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetCurrencyGrpc (CurrencyGrpcRequest) returns (ListCurrencyGrpc);
  rpc GetCurrencyGrpcStream (CurrencyGrpcRequest) returns (stream CurrencyGrpc);
  rpc GetCurrencyGrpcById (CurrencyByIdGrpcRequest) returns (ListCurrencyGrpc);

  rpc GetCustomerGrpc (CustomerGrpcRequest) returns (ListCustomerGrpc);
  rpc GetCustomerGrpcStream (CustomerGrpcRequest) returns (stream CustomerGrpc);
  rpc GetCustomerGrpcById (CustomerByIdGrpcRequest) returns (ListCustomerGrpc);
  rpc GetCustomerLocationGrpc (CustomerLocationGrpcRequest) returns (ListCustomerLocationGrpc);
  rpc GetCustomerLocationGrpcStream (CustomerLocationGrpcRequest) returns (stream CustomerLocationGrpc);
  rpc GetCustomerLocationGrpcById (CustomerLocationByIdGrpcRequest) returns (ListCustomerLocationGrpc);
  rpc GetCustomerLocationGrpcByUserId (CustomerLocationByUserIdGrpcRequest) returns (ListCustomerLocationGrpc);
  rpc GetCustomerSalesEntityGrpc (CustomerSalesEntityGrpcRequest) returns (ListCustomerSalesEntityGrpc);
  rpc GetCustomerSalesEntityGrpcStream (CustomerSalesEntityGrpcRequest) returns (stream CustomerSalesEntityGrpc);
  rpc GetCustomerSalesEntityGrpcByUserId (CustomerSalesEntityByUserIdGrpcRequest) returns (ListCustomerSalesEntityGrpc);
  rpc GetCustomerProjectAssociationGrpc (CustomerProjectAssociationGrpcRequest) returns (ListCustomerProjectAssociationGrpc);
  rpc GetCustomerProjectAssociationGrpcStream (CustomerProjectAssociationGrpcRequest) returns (stream CustomerProjectAssociationGrpc);
  rpc GetCustomerProjectAssociationGrpcByUserId (CustomerProjectAssociationByUserIdGrpcRequest) returns (ListCustomerProjectAssociationGrpc);
  rpc GetCustomerBusinessUserAssociationGrpc (CustomerBusinessUserAssociationGrpcRequest) returns (ListCustomerBusinessUserAssociationGrpc);
  rpc GetCustomerBusinessUserAssociationGrpcStream (CustomerBusinessUserAssociationGrpcRequest) returns (stream CustomerBusinessUserAssociationGrpc);
  rpc GetCustomerBusinessUserAssociationGrpcByUserId (CustomerBusinessUserAssociationByUserIdGrpcRequest) returns (ListCustomerBusinessUserAssociationGrpc);

  rpc GetMilestoneGrpc (MilestoneGrpcRequest) returns (ListMilestoneGrpc);
  rpc GetMilestoneGrpcStream (MilestoneGrpcRequest) returns (stream MilestoneGrpc);
  rpc GetMilestoneGrpcById (MilestoneByIdGrpcRequest) returns (ListMilestoneGrpc);
  rpc GetPlatformGrpc (PlatformGrpcRequest) returns (ListPlatformGrpc);
  rpc GetPlatformGrpcStream (PlatformGrpcRequest) returns (stream PlatformGrpc);
  rpc GetPlatformGrpcById (PlatformByIdGrpcRequest) returns (ListPlatformGrpc);
  rpc GetProgramGrpc (ProgramGrpcRequest) returns (ListProgramGrpc);
  rpc GetProgramGrpcStream (ProgramGrpcRequest) returns (stream ProgramGrpc);
  rpc GetProgramGrpcById (ProgramByIdGrpcRequest) returns (ListProgramGrpc);
  rpc GetProjectGrpc (ProjectGrpcRequest) returns (ListProjectGrpc);
  rpc GetProjectGrpcStream (ProjectGrpcRequest) returns (stream ProjectGrpc);
  rpc GetProjectGrpcById (ProjectByIdGrpcRequest) returns (ListProjectGrpc);

  rpc GetVehicleGrpc (VehicleGrpcRequest) returns (ListVehicleGrpc);
  rpc GetVehicleGrpcStream (VehicleGrpcRequest) returns (stream VehicleGrpc);
  rpc GetVehicleGrpcById (VehicleByIdGrpcRequest) returns (ListVehicleGrpc);
  rpc GetVehicleGrpcByDisplay (VehicleByDisplayGrpcRequest) returns (ListVehicleGrpc);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  google.protobuf.StringValue message = 1;
}

message CurrencyGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CurrencyByIdGrpcRequest {
    string Id = 1;
}

message CurrencyGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CurrencyCode = 2;
    google.protobuf.StringValue CurrencyName = 3;
    google.protobuf.StringValue EuroRate = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListCurrencyGrpc {
    repeated CurrencyGrpc CurrencyGrpc = 1;
}

message CustomerGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerByIdGrpcRequest {
    string Id = 1;
}

message CustomerGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CustomerBusinessGroupCode = 2;
    google.protobuf.StringValue CustomerBusinessGroupName = 3;   
    google.protobuf.StringValue SEWSEBusinessTeam = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListCustomerGrpc {
    repeated CustomerGrpc CustomerGrpc = 1;
}

message CustomerLocationGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerLocationByIdGrpcRequest {
    string Id = 1;
}

message CustomerLocationByUserIdGrpcRequest {
    string UserId = 1;
}

message CustomerLocationGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CustomerCode = 2;
    google.protobuf.StringValue CustomerBusinessHierarchyGuid = 3;
    google.protobuf.StringValue CustomerName = 4;   
    google.protobuf.BoolValue IsActive = 5;
}

message ListCustomerLocationGrpc {
    repeated CustomerLocationGrpc CustomerLocationGrpc = 1;
}

message CustomerSalesEntityGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerSalesEntityByUserIdGrpcRequest {
  string UserId = 1;
}

message CustomerSalesEntityGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CustomerSalesEntityCode = 2;
    google.protobuf.StringValue CustomerSalesEntityName = 3;   
    google.protobuf.StringValue FinanceCode = 4;  
    google.protobuf.StringValue CustomerHierarchyGuid = 5;  
    google.protobuf.BoolValue IsActive = 6;
}

message ListCustomerSalesEntityGrpc {
    repeated CustomerSalesEntityGrpc CustomerSalesEntityGrpc = 1;
}

message CustomerProjectAssociationGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerProjectAssociationByUserIdGrpcRequest {
    string UserId = 1;
}

message CustomerProjectAssociationGrpc {
    string Id = 1;
    string CustomerLocationGuid = 2;
    string ProjectGuid = 3;    
    bool IsActive = 4;
}

message ListCustomerProjectAssociationGrpc {
    repeated CustomerProjectAssociationGrpc CustomerProjectAssociationGrpc = 1;
}

message CustomerBusinessUserAssociationGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerBusinessUserAssociationByUserIdGrpcRequest {
  string UserId = 1;
}

message CustomerBusinessUserAssociationGrpc {
    string Id = 1;
    string CustomerBusinessHierarchyList = 2;
    string UserGuid = 3;    
    bool IsActive = 4;
}

message ListCustomerBusinessUserAssociationGrpc {
    repeated CustomerBusinessUserAssociationGrpc CustomerBusinessUserAssociationGrpc = 1;
}

message MilestoneGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}
message MilestoneByIdGrpcRequest {
    string Id = 1;
}

message MilestoneGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue MilestoneEventName = 2;
    google.protobuf.Timestamp EventStartDate = 3;    
    google.protobuf.Timestamp EventEndDate = 4;  
    google.protobuf.StringValue ProjectHierarchyGuid = 5;
    google.protobuf.BoolValue IsActive = 6;
}

message ListMilestoneGrpc {
    repeated MilestoneGrpc MilestoneGrpc = 1;
}

message PlatformGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message PlatformByIdGrpcRequest {
    string Id = 1;
}

message PlatformGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue PlatformName = 2;
    google.protobuf.StringValue PlatformManagerName = 3;    
    google.protobuf.StringValue CustomerHierarchyGuid = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListPlatformGrpc {
    repeated PlatformGrpc PlatformGrpc = 1;
}

message ProgramGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message ProgramByIdGrpcRequest {
    string Id = 1;
}

message ProgramGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue ProgramName = 2;   
    google.protobuf.StringValue PlatformHierarchyGuid = 3;
    google.protobuf.BoolValue IsActive = 4;
}

message ListProgramGrpc {
    repeated ProgramGrpc ProgramGrpc = 1;
}

message ProjectGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}
message ProjectByIdGrpcRequest {
    string Id = 1;
}

message ProjectGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue ProjectCode = 2;   
    google.protobuf.StringValue ProjectName = 3;
    google.protobuf.StringValue CustomerProjectCode = 4;
    google.protobuf.StringValue ProjectDescription = 5;
    google.protobuf.Int32Value ProjectAnnualVolume = 6;
    google.protobuf.StringValue ProgramHierarchyGuid = 7;
    google.protobuf.BoolValue IsActive = 8;
}

message ListProjectGrpc {
    repeated ProjectGrpc ProjectGrpc = 1;
}

message VehicleGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message VehicleByIdGrpcRequest {
    string Id = 1;
}

message VehicleByDisplayGrpcRequest {
    string VehicleDisplay = 1;
}

message VehicleGrpc {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue VehicleName = 2;   
    google.protobuf.StringValue ProjectReference = 3;
    google.protobuf.StringValue VehicleDisplay = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListVehicleGrpc {
    repeated VehicleGrpc VehicleGrpc = 1;
}

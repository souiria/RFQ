syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Master";

package master;

// The master access service definition.
service Master {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetCurrencyData (CurrencyGrpcRequest) returns (ListCurrencyData);
  rpc GetCurrencyDataStream (CurrencyGrpcRequest) returns (stream CurrencyData);
  rpc GetCurrencyDataById (CurrencyByIdGrpcRequest) returns (ListCurrencyData);

  rpc GetCustomerData (CustomerGrpcRequest) returns (ListCustomerData);
  rpc GetCustomerDataStream (CustomerGrpcRequest) returns (stream CustomerData);
  rpc GetCustomerDataById (CustomerByIdGrpcRequest) returns (ListCustomerData);
  rpc GetCustomerLocationData (CustomerLocationGrpcRequest) returns (ListCustomerLocationData);
  rpc GetCustomerLocationDataStream (CustomerLocationGrpcRequest) returns (stream CustomerLocationData);
  rpc GetCustomerLocationDataById (CustomerLocationByIdGrpcRequest) returns (ListCustomerLocationData);
  rpc GetCustomerLocationDataByUserId (CustomerLocationByUserIdGrpcRequest) returns (ListCustomerLocationData);
  rpc GetCustomerSalesEntityData (CustomerSalesEntityGrpcRequest) returns (ListCustomerSalesEntityData);
  rpc GetCustomerSalesEntityDataStream (CustomerSalesEntityGrpcRequest) returns (stream CustomerSalesEntityData);
  rpc GetCustomerSalesEntityDataByUserId (CustomerSalesEntityByUserIdGrpcRequest) returns (ListCustomerSalesEntityData);
  rpc GetCustomerProjectAssociationData (CustomerProjectAssociationGrpcRequest) returns (ListCustomerProjectAssociationData);
  rpc GetCustomerProjectAssociationDataStream (CustomerProjectAssociationGrpcRequest) returns (stream CustomerProjectAssociationData);
  rpc GetCustomerProjectAssociationDataByUserId (CustomerProjectAssociationByUserIdGrpcRequest) returns (ListCustomerProjectAssociationData);
  rpc GetCustomerBusinessUserAssociationData (CustomerBusinessUserAssociationGrpcRequest) returns (ListCustomerBusinessUserAssociationData);
  rpc GetCustomerBusinessUserAssociationDataStream (CustomerBusinessUserAssociationGrpcRequest) returns (stream CustomerBusinessUserAssociationData);
  rpc GetCustomerBusinessUserAssociationDataByUserId (CustomerBusinessUserAssociationByUserIdGrpcRequest) returns (ListCustomerBusinessUserAssociationData);

  rpc GetMilestoneData (MilestoneGrpcRequest) returns (ListMilestoneData);
  rpc GetMilestoneDataStream (MilestoneGrpcRequest) returns (stream MilestoneData);
  rpc GetMilestoneDataById (MilestoneByIdGrpcRequest) returns (ListMilestoneData);
  rpc GetPlatformData (PlatformGrpcRequest) returns (ListPlatformData);
  rpc GetPlatformDataStream (PlatformGrpcRequest) returns (stream PlatformData);
  rpc GetPlatformDataById (PlatformByIdGrpcRequest) returns (ListPlatformData);
  rpc GetProgramData (ProgramGrpcRequest) returns (ListProgramData);
  rpc GetProgramDataStream (ProgramGrpcRequest) returns (stream ProgramData);
  rpc GetProgramDataById (ProgramByIdGrpcRequest) returns (ListProgramData);
  rpc GetProjectData (ProjectGrpcRequest) returns (ListProjectData);
  rpc GetProjectDataStream (ProjectGrpcRequest) returns (stream ProjectData);
  rpc GetProjectDataById (ProjectByIdGrpcRequest) returns (ListProjectData);

  rpc GetVehicleData (VehicleGrpcRequest) returns (ListVehicleData);
  rpc GetVehicleDataStream (VehicleGrpcRequest) returns (stream VehicleData);
  rpc GetVehicleDataById (VehicleByIdGrpcRequest) returns (ListVehicleData);
  rpc GetVehicleDataByDisplay (VehicleByDisplayGrpcRequest) returns (ListVehicleData);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  google.protobuf.StringValue message = 1;
}

message CurrencyGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CurrencyByIdGrpcRequest {
    string Id = 1;
}

message CurrencyData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CurrencyCode = 2;
    google.protobuf.StringValue CurrencyName = 3;
    google.protobuf.StringValue EuroRate = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListCurrencyData {
    repeated CurrencyData CurrencyData = 1;
}

message CustomerGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerByIdGrpcRequest {
    string Id = 1;
}

message CustomerData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CustomerBusinessGroupCode = 2;
    google.protobuf.StringValue CustomerBusinessGroupName = 3;   
    google.protobuf.StringValue SEWSEBusinessTeam = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListCustomerData {
    repeated CustomerData CustomerData = 1;
}

message CustomerLocationGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerLocationByIdGrpcRequest {
    string Id = 1;
}

message CustomerLocationByUserIdGrpcRequest {
    string UserId = 1;
}

message CustomerLocationData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CustomerCode = 2;
    google.protobuf.StringValue CustomerBusinessHierarchyGuid = 3;
    google.protobuf.StringValue CustomerName = 4;   
    google.protobuf.BoolValue IsActive = 5;
}

message ListCustomerLocationData {
    repeated CustomerLocationData CustomerLocationData = 1;
}

message CustomerSalesEntityGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerSalesEntityByUserIdGrpcRequest {
  string UserId = 1;
}

message CustomerSalesEntityData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue CustomerSalesEntityCode = 2;
    google.protobuf.StringValue CustomerSalesEntityName = 3;   
    google.protobuf.StringValue FinanceCode = 4;  
    google.protobuf.StringValue CustomerHierarchyGuid = 5;  
    google.protobuf.BoolValue IsActive = 6;
}

message ListCustomerSalesEntityData {
    repeated CustomerSalesEntityData CustomerSalesEntityData = 1;
}

message CustomerProjectAssociationGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerProjectAssociationByUserIdGrpcRequest {
    string UserId = 1;
}

message CustomerProjectAssociationData {
    string Id = 1;
    string CustomerLocationGuid = 2;
    string ProjectGuid = 3;    
    bool IsActive = 4;
}

message ListCustomerProjectAssociationData {
    repeated CustomerProjectAssociationData CustomerProjectAssociationData = 1;
}

message CustomerBusinessUserAssociationGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CustomerBusinessUserAssociationByUserIdGrpcRequest {
  string UserId = 1;
}

message CustomerBusinessUserAssociationData {
    string Id = 1;
    string CustomerBusinessHierarchyList = 2;
    string UserGuid = 3;    
    bool IsActive = 4;
}

message ListCustomerBusinessUserAssociationData {
    repeated CustomerBusinessUserAssociationData CustomerBusinessUserAssociationData = 1;
}

message MilestoneGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}
message MilestoneByIdGrpcRequest {
    string Id = 1;
}

message MilestoneData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue MilestoneEventName = 2;
    google.protobuf.Timestamp EventStartDate = 3;    
    google.protobuf.Timestamp EventEndDate = 4;  
    google.protobuf.StringValue ProjectHierarchyGuid = 5;
    google.protobuf.BoolValue IsActive = 6;
}

message ListMilestoneData {
    repeated MilestoneData MilestoneData = 1;
}

message PlatformGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message PlatformByIdGrpcRequest {
    string Id = 1;
}

message PlatformData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue PlatformName = 2;
    google.protobuf.StringValue PlatformManagerName = 3;    
    google.protobuf.StringValue CustomerHierarchyGuid = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListPlatformData {
    repeated PlatformData PlatformData = 1;
}

message ProgramGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message ProgramByIdGrpcRequest {
    string Id = 1;
}

message ProgramData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue ProgramName = 2;   
    google.protobuf.StringValue PlatformHierarchyGuid = 3;
    google.protobuf.BoolValue IsActive = 4;
}

message ListProgramData {
    repeated ProgramData ProgramData = 1;
}

message ProjectGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}
message ProjectByIdGrpcRequest {
    string Id = 1;
}

message ProjectData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue ProjectCode = 2;   
    google.protobuf.StringValue ProjectName = 3;
    google.protobuf.StringValue CustomerProjectCode = 4;
    google.protobuf.StringValue ProjectDescription = 5;
    google.protobuf.Int32Value ProjectAnnualVolume = 6;
    google.protobuf.StringValue ProgramHierarchyGuid = 7;
    google.protobuf.BoolValue IsActive = 8;
}

message ListProjectData {
    repeated ProjectData ProjectData = 1;
}

message VehicleGrpcRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message VehicleByIdGrpcRequest {
    string Id = 1;
}

message VehicleByDisplayGrpcRequest {
    string VehicleDisplay = 1;
}

message VehicleData {
    google.protobuf.StringValue Id = 1;
    google.protobuf.StringValue VehicleName = 2;   
    google.protobuf.StringValue ProjectReference = 3;
    google.protobuf.StringValue VehicleDisplay = 4;
    google.protobuf.BoolValue IsActive = 5;
}

message ListVehicleData {
    repeated VehicleData VehicleData = 1;
}

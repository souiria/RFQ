    google.protobuf.Int32Value L3 = 52;
    google.protobuf.DoubleValue  PitchWidth = 53;
    google.protobuf.Int32Value Tilt = 54;
    google.protobuf.Int32Value Grease = 55;
    google.protobuf.StringValue CategoryCode = 56;
}

message GetPARTMSDataGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}
message GetPARTMSDataByClassGrpcRequest {
    string Class1 = 1;
    double Class2 = 2;
}
message GetPARTMSDataByColorCodeGrpcRequest {
    string ColorCode = 1;
}
message GetPARTMSDataByMaterialGrpcRequest {
    string MaterialGroup = 1;
    string MaterialType = 2;
}
message GetPARTMSDataByMaterialGroupGrpcRequest {
    string MaterialGroup = 1;
}
message GetPARTMSDataByPartGroupGrpcRequest {
    string PartGroup = 1;
}
message GetPARTMSDataByCategoryCodeGrpcRequest {
    string CatogoryCode = 1;
}
message GetPARTMSDataByPartGroupsConstCodeGrpcRequest {
    string PartGroupsConstCode = 1;
}

message ListPARTMSData {
    repeated PARTMSData PARTMSData = 1;
}
message PARTMSData {
    google.protobuf.StringValue SumitomoNumber = 1;
    google.protobuf.StringValue SumitomoDescription = 2;
    google.protobuf.StringValue SumitomoDescriptionEnglish = 3;
    google.protobuf.StringValue OldPartClass = 4;
    google.protobuf.StringValue OldMaterial = 5;
    google.protobuf.StringValue ClassDetailGroupCode = 6;
    google.protobuf.StringValue ClassDetailId = 7;
    google.protobuf.StringValue MaterialGroupId = 8;
    google.protobuf.StringValue MaterialTypeId = 9;
    google.protobuf.StringValue ColorCode = 10;
    google.protobuf.Int32Value NumberOfCavity = 11;
    google.protobuf.DoubleValue InsideDiameter = 12;
    google.protobuf.DoubleValue WallThickness = 13;
    google.protobuf.DoubleValue Length = 14;
    google.protobuf.DoubleValue WidthOrOutsideDiameter = 15;
    google.protobuf.Int32Value HoleDiameter = 16;
    google.protobuf.Int32Value ShrinkRateLength = 17;
    google.protobuf.Int32Value NumberOfTapingSpots = 18;
    google.protobuf.DoubleValue MassOrWeight = 19;
    google.protobuf.DoubleValue Quantity = 20;
    google.protobuf.StringValue UoM = 21;
    google.protobuf.StringValue Group1 = 22;
    google.protobuf.StringValue Group2 = 23;
    google.protobuf.StringValue Group3 = 24;
    google.protobuf.StringValue Group4 = 25;
    google.protobuf.StringValue CavityCount = 26;
    google.protobuf.StringValue Group6 = 27;
    google.protobuf.StringValue Group7 = 28;
    google.protobuf.StringValue Group8 = 29;
    google.protobuf.StringValue CustomerId = 30;
    google.protobuf.DoubleValue MassOrWeight2 = 31;
    google.protobuf.Int32Value L1 = 32;
    google.protobuf.Int32Value L2 = 33;
    google.protobuf.Int32Value L3 = 34;
    google.protobuf.DoubleValue PitchWidth = 35;
    google.protobuf.Int32Value Tilt = 36;
    google.protobuf.Int32Value Grease = 37;
    google.protobuf.StringValue CategoryCode = 38;

}
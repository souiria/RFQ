    google.protobuf.StringValue SumitomoDescription = 2;
    google.protobuf.StringValue SumitomoDescriptionEnglish = 3;
    google.protobuf.StringValue PartGroup = 4; // 
    google.protobuf.StringValue GroupDescription = 5;
    google.protobuf.StringValue Class1 = 6;
    google.protobuf.StringValue Class1Name = 7;
    google.protobuf.DoubleValue Class2 = 8;
    google.protobuf.StringValue Class2Name = 9;
    google.protobuf.StringValue ColourCode = 10;
    google.protobuf.StringValue ColorName = 11;
    google.protobuf.StringValue MaterialGroup = 12;
    google.protobuf.StringValue Expr1 = 13;
    google.protobuf.StringValue MaterialType = 14;
    google.protobuf.StringValue TypeDescription = 15;
    google.protobuf.StringValue CategoryCode2 = 16;
    google.protobuf.DoubleValue DetailedCategoryCode = 17;
    google.protobuf.StringValue CategoryName = 18;
    google.protobuf.StringValue PartGroupCode = 19;
    google.protobuf.StringValue Description = 20; //
    google.protobuf.StringValue OldPartClass = 21;
    google.protobuf.StringValue OldMaterial = 22;
    google.protobuf.StringValue ClassDetailGroupCode = 23;
    google.protobuf.StringValue ClassDetailId = 24;
    google.protobuf.StringValue MaterialGroupId = 25;
    google.protobuf.StringValue MaterialTypeId = 26;
    google.protobuf.StringValue ColorCode = 27;
    google.protobuf.Int32Value NumberOfCavity = 28;

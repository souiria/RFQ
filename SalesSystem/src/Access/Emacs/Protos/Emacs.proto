syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";


option csharp_namespace = "Emacs";

package emacs;

// The Emacs service definition.
service Emacs {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  
  rpc GetCombinedPartsData (CombinedPartsGrpcRequest) returns (ListCombinedPartsData);
  rpc GetCombinedPartsDataCount (CombinedPartsCountGrpcRequest) returns (CombinedPartsCountData);

  rpc GetPartCategoryDetailData (PartCategoryDetailGrpcRequest) returns (ListPartCategoryDetailData);
  rpc GetPartCategoryDetailDataByCategoryCode (PartCategoryDetailByCategoryCodeGrpcRequest) returns (ListPartCategoryDetailData);

  rpc GetPartClassDetailData (PartClassDetailGrpcRequest) returns (ListPartClassDetailData);
  rpc GetPartClassDetailDataByClasses (PartClassDetailByClassesGrpcRequest) returns (ListPartClassDetailData);

  rpc GetPartGroupsData (PartGroupsGrpcRequest) returns (ListPartGroupsData);
  rpc GetPartGroupsDataByPartGroup (PartGroupsByPartGroupGrpcRequest) returns (ListPartGroupsData);

  rpc GetPartGroupsConstData (PartGroupsConstGrpcRequest) returns (ListPartGroupsConstData);
  rpc GetPartGroupsConstDataByGroup3 (PartGroupsConstByGroup3GrpcRequest) returns (ListPartGroupsConstData);

  rpc GetCustomerData (GetCustomerDataGrpcRequest) returns (ListCustomerDataGrpc);

  rpc GetColourCodeData (GetColourCodeGrpcRequest) returns (ListColourCodeData);
  rpc GetColourCodeDataByColorCode (GetColourCodeByColorCodeGrpcRequest) returns (ListColourCodeData);

  rpc GetMaterialGroupsData (GetMaterialGroupsGrpcRequest) returns (ListMaterialGroupsData);
  rpc GetMaterialGroupsDataByMaterialGroupId (GetMaterialGroupsByMaterialGroupIdGrpcRequest) returns (ListMaterialGroupsData);

  rpc GetMaterialTypesData (GetMaterialTypesGrpcRequest) returns (ListMaterialTypesData);
  rpc GetMaterialTypesDataByMaterials (GetMaterialTypesByMaterialsGrpcRequest) returns (ListMaterialTypesData);

  rpc GetNPACustomerData (GetNPACustomerGrpcRequest) returns (ListNPACustomerData);

  rpc GetNPASupplierData (GetNPASupplierGrpcRequest) returns (ListNPASupplierData);

  rpc GetSuppliersData (GetSuppliersGrpcRequest) returns (ListSuppliersData);

  rpc GetEmacsRFIViewData (GetEmacsRFIViewGrpcRequest) returns (ListEmacsRFIViewData);

  rpc GetPARTMSData (GetPARTMSDataGrpcRequest) returns (ListPARTMSData);
  rpc GetPARTMSDataByClass (GetPARTMSDataByClassGrpcRequest) returns (ListPARTMSData);
  rpc GetPARTMSDataByColorCode (GetPARTMSDataByColorCodeGrpcRequest) returns (ListPARTMSData);
  rpc GetPARTMSDataByMaterial (GetPARTMSDataByMaterialGrpcRequest) returns (ListPARTMSData);
  rpc GetPARTMSDataByMaterialGroup (GetPARTMSDataByMaterialGroupGrpcRequest) returns (ListPARTMSData);
  rpc GetPARTMSDataByPartGroup(GetPARTMSDataByPartGroupGrpcRequest) returns (ListPARTMSData);
  rpc GetPARTMSDataByCategoryCode(GetPARTMSDataByCategoryCodeGrpcRequest) returns (ListPARTMSData);
  rpc GetPARTMSDataByPartGroupsConstCode(GetPARTMSDataByPartGroupsConstCodeGrpcRequest) returns (ListPARTMSData);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message CombinedPartsGrpcRequest {
  int32 position = 1;
  int32 takeAmount = 2;
}

message CombinedPartsCountGrpcRequest {
}

message CombinedPartsData {
    google.protobuf.StringValue SumitomoNumber = 1;
    google.protobuf.StringValue CustomerNumber = 2;
    google.protobuf.StringValue CustomerName = 3;
    google.protobuf.StringValue SupplierNumber = 4;
    google.protobuf.StringValue UniformSumitomoNumber = 5;
    google.protobuf.StringValue UniformCustomerNumber = 6;
    google.protobuf.StringValue UniformSupplierNumber = 7;
}

message ListCombinedPartsData {
    repeated CombinedPartsData CombinedPartsData = 1;
}

message CombinedPartsCountData {
    int32 count = 1;
}

message PartCategoryDetailGrpcRequest  {
    int32 position = 1;
    int32 takeAmount = 2;
}
message PartCategoryDetailByCategoryCodeGrpcRequest  {
    string CategoryCode = 1;
}

message ListPartCategoryDetailData {
    repeated PartCategoryDetailData PartCategoryDetailData = 1;
}

message PartCategoryDetailData {
    string CategoryCode = 1;
    double DetailedCategoryCode = 2;
    string CategoryName = 3;
}

message PartClassDetailGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}
message PartClassDetailByClassesGrpcRequest {
    string Class1 = 1;
    double Class2 = 2;
}

message ListPartClassDetailData {
    repeated PartClassDetailData PartClassDetailData = 1;
}

message PartClassDetailData {
    string Class1 = 1;
    string Class1Name = 2;
    double Class2 = 3;
    string Class2Name = 4;
}

message PartGroupsGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message PartGroupsByPartGroupGrpcRequest {
    string PartGroup = 1;
}

message ListPartGroupsData {
    repeated PartGroupsData PartGroupsData = 1;
}

message PartGroupsData {
    string PartGroup = 1;
    string GroupDescription = 2;
}

message PartGroupsConstGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}
message PartGroupsConstByGroup3GrpcRequest {
    string Group3 = 1;
}

message ListPartGroupsConstData {
    repeated PartGroupsConstData PartGroupsConstData = 1;
}

message PartGroupsConstData {
    int32 Id = 1;
    int32 GroupNo = 2;
    int32 GroupPos = 3;
    string GroupName = 4;
    string Code = 5;
    string Description = 6;
}

message GetCustomerDataGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListCustomerDataGrpc {
    repeated CustomerDataGrpc CustomerDataGrpc = 1;
}

message CustomerDataGrpc {
    string CustomerCode = 1;
    string Customer = 2;
    string CustomerGroup = 3;
}

message GetColourCodeGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message GetColourCodeByColorCodeGrpcRequest {
    string ColorCode = 1;
}

message ListColourCodeData {
    repeated ColourCodeData ColourCodeData = 1;
}

message ColourCodeData {
    string ClMk = 1;
    string ClCode = 2;
    string ColorName = 3;
    int32 WireUnitsFlag = 4;
    int32 PartUnitsFlag = 5;
}

message GetMaterialGroupsGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message GetMaterialGroupsByMaterialGroupIdGrpcRequest {
    string MaterialGroup = 1;
}

message ListMaterialGroupsData {
    repeated MaterialGroupsData MaterialGroupsData = 1;
}

message MaterialGroupsData {
    string MaterialGroup = 1;
    string GroupDescription = 2;
}

message GetMaterialTypesGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}
message GetMaterialTypesByMaterialsGrpcRequest {
    string MaterialGroup = 1;
    string MaterialType = 2;
}

message ListMaterialTypesData {
    repeated MaterialTypesData MaterialTypesData = 1;
}

message MaterialTypesData {
    string MaterialGroup = 1;
    string MaterialType = 2;
    string TypeDescription = 3;
}

message GetNPACustomerGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListNPACustomerData {
    repeated NPACustomerData NPACustomerData = 1;
}

message NPACustomerData {
    int64 Id = 1;
    string Code = 2;
    string Name = 3;
    int64 Subsidiary_id = 4;
    int64 Buyer_id = 5;
    string Address = 6;
    string Phone =  7;
    string Email  = 8;
    string Contact = 9;
    string Alternate_contact = 10;
    google.protobuf.BoolValue active = 11;
}

message GetNPASupplierGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListNPASupplierData {
    repeated NPASupplierData NPASupplierData = 1;
}

message NPASupplierData {
    int64 Id = 1;
    string Code = 2;
    string Name = 3;
    int64 Subsidiary_id = 4;
    int64 Buyer_id = 5;
    string Address = 6;
    string Phone =  7;
    string Email  = 8;
    string Contact = 9;
    string Alternate_contact = 10;
    google.protobuf.BoolValue Active = 11;
    google.protobuf.BoolValue J_Supplier = 12;
}

message GetSuppliersGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListSuppliersData {
    repeated SuppliersData SuppliersData = 1;
}

message SuppliersData {
    int32 SupplierCode = 1;
    string SupplierName = 2;
}

message GetEmacsRFIViewGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListEmacsRFIViewData {
    repeated EmacsRFIViewData EmacsRFIViewData = 1;
}


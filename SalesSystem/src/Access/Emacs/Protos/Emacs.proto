syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Emacs";

package emacs;

// The Emacs service definition.
service Emacs {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  
  rpc GetCombinedPartsData (CombinedPartsGrpcRequest) returns (ListCombinedPartsData);
  rpc GetCombinedPartsDataCount (CombinedPartsCountGrpcRequest) returns (CombinedPartsCountData);

  rpc GetPartCategoryDetailData (PartCategoryDetailGrpcRequest) returns (ListPartCategoryDetail);

  rpc GetPartClassDetailData (PartClassDetailGrpcRequest) returns (ListPartClassDetail);

  rpc GetPartGroupsData (PartGroupsGrpcRequest) returns (ListPartGroups);

  rpc GetPartGroupsConstData (PartGroupsConstGrpcRequest) returns (ListPartGroupsConst);

  rpc GetCustomerData (GetCustomerDataGrpcRequest) returns (ListCustomerData);

  rpc GetColourCode (GetColourCodeGrpcRequest) returns (ListColourCode);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message CombinedPartsGrpcRequest {
  int32 position = 1;
  int32 takeAmount = 2;
}

message CombinedPartsCountGrpcRequest {
}

message CombinedPartsData {
    google.protobuf.StringValue SumitomoNumber = 1;
    google.protobuf.StringValue CustomerNumber = 2;
    google.protobuf.StringValue CustomerName = 3;
    google.protobuf.StringValue SupplierNumber = 4;
    google.protobuf.StringValue UniformSumitomoNumber = 5;
    google.protobuf.StringValue UniformCustomerNumber = 6;
    google.protobuf.StringValue UniformSupplierNumber = 7;
}

message ListCombinedPartsData {
    repeated CombinedPartsData CombinedPartsData = 1;
}

message CombinedPartsCountData {
    int32 count = 1;
}

message PartCategoryDetailGrpcRequest  {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListPartCategoryDetail {
    repeated PartCategoryDetail PartCategoryDetail = 1;
}

message PartCategoryDetail {
    string CategoryCode = 1;
    double DetailedCategoryCode = 2;
    string CategoryName = 3;
}

message PartClassDetailGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListPartClassDetail {
    repeated PartClassDetail PartClassDetail = 1;
}

message PartClassDetail {
    string Class1 = 1;
    string Class1Name = 2;
    double Class2 = 3;
    string Class2Name = 4;
}

message PartGroupsGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListPartGroups {
    repeated PartGroups PartGroups = 1;
}

message PartGroups {
    string PartGroup = 1;
    string GroupDescription = 2;
}

message PartGroupsConstGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListPartGroupsConst {
    repeated PartGroupsConst PartGroupsConst = 1;
}

message PartGroupsConst {
    int32 Id = 1;
    int32 GroupNo = 2;
    int32 GroupPos = 3;
    string GroupName = 4;
    string Code = 5;
    string Description = 6;
}

message GetCustomerDataGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListCustomerData {
    repeated CustomerData CustomerData = 1;
}

message CustomerData {
    string CustomerCode = 1;
    string Customer = 2;
    string CustomerGroup = 3;
}

message GetColourCodeGrpcRequest {
    int32 position = 1;
    int32 takeAmount = 2;
}

message ListColourCode {
    repeated ColourCode ColourCode = 1;
}

message ColourCode {
    string Clmk = 1;
    string ClCode = 2;
    string ColorName = 3;
    int32 WireUnitsFlag = 4;
    int32 PartUnitsFlag = 5;
}
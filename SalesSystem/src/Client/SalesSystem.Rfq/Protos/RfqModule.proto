syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "RfqModule";

package RfqModule;

// The RfqModule by feature
service RfqModule {
    // Sends a greeting
    rpc SayHello (HelloRequest) returns (HelloReply);

    // Uploads a file
    rpc UploadFile (FileUploadRequest) returns (FileUploadResponse);

    // RfqProject handling - customer, project association, vehicle by project, project CRUD
    // Create/Edit Rfq related data
    rpc GetAllCustomersGrpc (GetAllCustomersGrpcRequest) returns (GetAllCustomersGrpcResponse);
    //rpc GetCustomersByUserIdGrpc (GetCustomersByUserIdGrpcRequest) returns (GetCustomersByUserIdGrpcResponse);
    rpc GetProjectAssociationsByCustomerId (GetProjectAssociationsByCustomerIdRequest) returns (GetProjectAssociationsByCustomerIdResponse);
    rpc GetRfqReasonsGrpc (GetRfqReasonsGrpcRequest) returns (GetRfqReasonsGrpcResponse);
    rpc GetVehicleByProjectCodeGrpc (GetVehicleByProjectCodeGrpcRequest) returns (GetVehicleByProjectCodeGrpcResponse);
    // part upload
    rpc UploadPartsGrpc (UploadPartsRequestGrpcRequest) returns (UploadPartsRequestGrpcResponse);
    // RfqProject handling - Dashboard grid (the project list), Edit/Create screens for CRUD
    rpc CreateRfqProjectGrpc (CreateRfqProjectGrpcRequest) returns (CreateRfqProjectGrpcResponse);
    rpc GetAllRfqProjectGrpc (GetAllRfqProjectGrpcRequest) returns (GetAllRfqProjectGrpcResponse);
    rpc GetRfqProjectByIdGrpc (GetRfqProjectByIdGrpcRequest) returns (GetRfqProjectByIdGrpcResponse);
    rpc UpdateRfqProjectGrpc (UpdateRfqProjectGrpcRequest) returns (UpdateRfqProjectGrpcResponse);
    rpc GetCustomerLocationsByUserIdGrpc (GetCustomerLocationsByUserIdRequest) returns (GetCustomerLocationsByUserIdResponse);
    rpc GetCustomerBusinessUnitsByUserIdGrpc (GetCustomerBusinessUnitsByUserIdRequest) returns (GetCustomerBusinessUnitsByUserIdResponse);
    // RfqProject Parts handling
    rpc GetRfqDrawingPartNumbersByRfqIdGrpc (GetRfqDrawingPartNumbersByRfqIdGrpcRequest) returns (GetRfqDrawingPartNumbersByRfqIdGrpcResponse);
    //  rpc UpdateRfqDrawingPartNumbersGrpc (RfqDrawingPartNumbersGrpcRequestt) returns (UpdateRfqDrawingPartNumbersGrpcResponse);
    rpc UpdateRfqDrawingPartNumbersGrpc (UpdateRfqDrawingPartNumbersGrpcRequest) returns (UpdateRfqDrawingPartNumbersGrpcResponse);
    rpc DeleteRfqProjectByRowIdGrpc (RfqProjectRequest) returns (RfqCrudResponse);
    rpc GetAlternativePartInfoBySumitomoNumberGrpc (GetAlternativePartInfoBySumitomoNumberRequest) returns (GetAlternativePartInfoBySumitomoNumberResponse);    
    rpc GetAllAlternativePartsGrpc (GetAllAlternativePartsGrpcRequest) returns (GetAllAlternativePartsGrpcResponse);
    // NprRequest local handling
    rpc GetRfqNprRequestByRfqNumberGrpc (GetRfqNprRequestByRfqNumberGrpcRequest) returns (GetRfqNprRequestByRfqNumberGrpcResponse);
    rpc GetRfqNprRequestByRfqProjectIdGrpc (GetRfqNprRequestByRfqProjectIdGrpcRequest) returns (GetRfqNprRequestByRfqProjectIdGrpcResponse);
    rpc GetRfqNprRequestByIdGrpc (GetRfqNprRequestByIdGrpcRequest) returns (GetRfqNprRequestByIdGrpcResponse);
    rpc GetAllRfqNprRequestGrpc (GetAllRfqNprRequestGrpcRequest) returns (GetAllRfqNprRequestGrpcResponse);
    rpc CreateRfqNprRequestGrpc (CreateRfqNprRequestGrpcRequest) returns (CreateRfqNprRequestGrpcResponse);
    rpc UpdateRfqNprRequestGrpc (UpdateRfqNprRequestGrpcRequest) returns (UpdateRfqNprRequestGrpcResponse);
    rpc UpdateRfqNprRequestStatusGrpc (UpdateRfqNprRequestStatusGrpcRequest) returns (UpdateRfqNprRequestStatusGrpcResponse);
    rpc DeleteRfqNprRequestByIdGrpc (DeleteRfqNprRequestByIdGrpcRequest) returns (DeleteRfqNprRequestByIdGrpcResponse);
    rpc ValidateNprRequestGrpc (MgrValidateNprRequestRequest) returns (MgrValidateNprRequestResponse);
    // NprRequest remote engineering API handling
    rpc CreateNprGrpc (CreateNprGrpcRequest) returns (CreateNprGrpcResponse);
    // Misc??? to be clarified
    rpc GetAllSuppliersGrpc (GetAllSuppliersGrpcRequest) returns (GetAllSuppliersGrpcResponse);
    rpc GetAllSupplierGroupsGrpc (GetAllSupplierGroupsGrpcRequest) returns (GetAllSupplierGroupsGrpcResponse);
    rpc SearchPartPricesGrpc (SearchPartPricesGrpcRequest) returns (SearchPartPricesGrpcResponse);
    rpc GetAllUnitOfMeasuresGrpc (GetAllUnitOfMeasuresRequest) returns (GetAllUnitOfMeasuresResponse);
    rpc GetAllBuisnessUnitsGrpc (GetAllBusinessUnitsGrpcRequest) returns (GetAllBusinessUnitsGrpcResponse);
    rpc WhoAmI (google.protobuf.Empty) returns (WhoAmIResponse);
    // Fintering handling
    rpc FilterGrpc (FilterGrpcRequest) returns (FilterGrpcResponse);
    // DSI handling
    rpc GetAllHarnessGrpc (GetAllHarnessModuleRequest) returns (GetAllHarnessModuleResponse);
    rpc GetHarnessByIdGrpc (GetHarnessByIdGrpcRequest) returns (GetHarnessByIdGrpcResponse);
    rpc GetCompositeDetailByHarnessGrpc (GetCompositeDetailByHarnessRequest) returns (GetCompositeDetailByHarnessResponse);
    rpc GetCompositeDetailByHarnessNameGrpc (GetCompositeDetailByHarnessNameRequest) returns (GetCompositeDetailByHarnessNameResponse);
    rpc GetWireSpecificationByCompositeOptionGrpc (GetWireSpecificationByCompositeOptionRequest) returns (GetWireSpecificationByCompositeOptionResponse);
    rpc GetComponentsByHarnessAndOptionsGrpc (GetComponentsByHarnessAndOptionsRequest) returns (ListComponentGrpc);

}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message FileUploadRequest {
  bytes file_data = 1;
  string file_name = 2;
}

message FileUploadResponse {
  bool success = 1;
  string message = 2;
  // Additional fields for the response as needed
}


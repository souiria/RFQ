syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
 
option csharp_namespace = "SalesSystem.Rfq.Client";
 
package RfqData;

service RfqDataService {
	rpc SayHello (HelloRequest) returns (HelloReply);

}

message HelloRequest {
	string name = 1;
}

message HelloReply {
	string message = 1;
}


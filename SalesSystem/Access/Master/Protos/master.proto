syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Master";

package master;

// The master access service definition.
service Master {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetCurrencyData (CurrencyRequest) returns (ListCurrencyData);
  rpc GetCurrencyDataStream (CurrencyRequest) returns (stream CurrencyData);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}

message CurrencyRequest {
  int32 position = 1;
  int32 takeamount = 2;
}

message CurrencyData {
    string Id = 1;
    string CurrencyCode = 2;
    string CurrencyName = 3;
    string EuroRate = 4;
    bool IsActive = 5;
}

message ListCurrencyData {
    repeated CurrencyData CurrencyData = 1;
}
